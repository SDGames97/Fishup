        function getNoteFrequency(note) {

            const notes = {

                "A4": 440.00,

                "B4": 493.88,

                "C5": 523.25,

                "D5": 587.33,

                "E5": 659.25,

                "F5": 698.46,

                "G5": 783.99,

                "A5": 880.00

            };

            return notes[note] || 440;

        }


        async function initAudio() {

            try {

                if (!audioCtx) {

                    const AudioContext =
                        window.AudioContext ||
                        window.webkitAudioContext;


                    audioCtx =
                        new AudioContext();


                    mainGainNode =
                        audioCtx.createGain();


                    mainGainNode.gain.setValueAtTime(
                        musicVolume,
                        audioCtx.currentTime
                    );


                    mainGainNode.connect(
                        audioCtx.destination
                    );

                }


                if (
                    audioCtx.state ===
                    'suspended'
                ) {

                    await audioCtx.resume();

                }

            }

            catch (e) {

                console.log(
                    "Audio Init Warning:",
                    e
                );

            }

        }


        function playTone(
            freq,
            duration
        ) {

            if (
                !audioCtx ||
                musicVolume <= 0
            ) {
                return;
            }


            try {

                const osc =
                    audioCtx.createOscillator();


                const noteGain =
                    audioCtx.createGain();


                osc.type =
                    'triangle';


                osc.frequency.setValueAtTime(
                    freq,
                    audioCtx.currentTime
                );


                noteGain.gain.setValueAtTime(
                    0.2,
                    audioCtx.currentTime
                );


                noteGain.gain.exponentialRampToValueAtTime(
                    0.001,
                    audioCtx.currentTime +
                    duration -
                    0.02
                );


                osc.connect(
                    noteGain
                );


                noteGain.connect(
                    mainGainNode
                );


                osc.start();


                osc.stop(
                    audioCtx.currentTime +
                    duration
                );

            }

            catch (e) {}

        }


        async function startMusic() {

            await initAudio();


            if (isMusicPlaying) {
                return;
            }


            isMusicPlaying = true;


            let step = 0;


            function playNextNote() {

                if (!isMusicPlaying) {
                    return;
                }


                const noteData =
                    MELODY_NOTES[step];


                playTone(
                    getNoteFrequency(
                        noteData.note
                    ),
                    noteData.duration
                );


                step =
                    (
                        step + 1
                    ) %
                    MELODY_NOTES.length;


                musicTimer =
                    setTimeout(
                        playNextNote,
                        noteData.duration *
                        1000
                    );

            }


            playNextNote();

        }


        function stopMusic() {

            isMusicPlaying = false;


            if (musicTimer) {

                clearTimeout(
                    musicTimer
                );

                musicTimer = null;

        function listenToOnlineLeaderboard() {

            database
                .ref('highscores')
                .orderByChild('score')
                .limitToLast(5)
                .on(
                    'value',
                    snapshot => {

                        let scores = [];


                        snapshot.forEach(
                            child => {

                                scores.push(
                                    child.val()
                                );

                            }
                        );


                        scores.reverse();


                        renderLeaderboardUI(
                            scores
                        );

                    }
                );

        }


        function renderLeaderboardUI(list) {

            const listEl =
                document.getElementById(
                    'leaderboardList'
                );


            listEl.innerHTML = '';


            if (
                list.length === 0
            ) {

                listEl.innerHTML =
                    '<li class="leaderboard-item">' +
                    'Noch keine Rekorde' +
                    '</li>';

                return;

            }


            list.forEach(
                (item, i) => {

                    const li =
                        document.createElement(
                            'li'
                        );


                    li.className =
                        'leaderboard-item' +
                        (
                            item.name === playerName
                                ? ' highlight'
                                : ''
                        );


                    const nameSpan =
                        document.createElement(
                            'span'
                        );


                    const scoreSpan =
                        document.createElement(
                            'span'
                        );


                    nameSpan.textContent =
                        `${i + 1}. ${item.name}`;


                    scoreSpan.textContent =
                        item.score;


                    li.appendChild(
                        nameSpan
                    );


                    li.appendChild(
                        scoreSpan
                    );


                    listEl.appendChild(
                        li
                    );

                }
            );

        }


        function saveScoreOnline(
            name,
            finalScore
        ) {

            if (!name) {
                return;
            }


            const userRef =
                database.ref(
                    'highscores/' +
                    name
                );


            userRef.once(
                'value',
                snapshot => {

                    const data =
                        snapshot.val();


                    if (
                        !data ||
                        finalScore >
                        data.score
                    ) {

                        userRef.set({

                            name:
                                name,

                            score:
                                finalScore

                        });

                    }

                }
            );

        }

        window.addEventListener(

                if (!isGameRunning) {

                /*

                 */

                if (

                        '#pauseButton'
                    )
                ) {

                }


                touchActive = true;


                const t =
                    e.touches[0];


                touchStartPos = {

                };

                e.preventDefault();

        );


        window.addEventListener(
            'touchmove',

                const t =
                    e.touches[0];


                touchCurrentPos = {

                    x:

                    y:

        function updateJoystick() {

            const dx =
                touchCurrentPos.x -
                touchStartPos.x;


            const dy =
                touchCurrentPos.y -
                touchStartPos.y;


            const dist =
                Math.hypot(
                    dx,
                    dy
                );


            const maxR = 40;


            const angle =
                Math.atan2(
                    dy,
                    dx
                );


            const moveD =
                Math.min(
                    dist,
                    maxR
                );


            const kX =
                Math.cos(angle) *
                moveD;


            const kY =
                Math.sin(angle) *
                moveD;


            joystickKnob.style.transform =
                `translate(
                    calc(-50% + ${kX}px),
                    calc(-50% + ${kY}px)
                )`;


            if (dist > 5) {

                const speedMult =
                    Math.min(
                        dist / maxR,
                        1
                    );


                player.vx =
                    Math.cos(angle) *
                    player.speed *
                    speedMult;


                player.vy =
                    Math.sin(angle) *
                    player.speed *
                    speedMult;


                player.targetAngle =
                    angle;

            }

            else {

                player.vx = 0;

                player.vy = 0;

            }

        }



        /* =====================================================
           FISCH SPAWNEN

        function spawnFish() {

            const rand =
                Math.random();


            let rank = 0;


            if (rand < 0.008) {

                rank = 4;

            }

            else if (rand < 0.08) {

                rank = 3;

            }

            else if (rand < 0.22) {

                rank = 2;

            }

            else if (rand < 0.48) {

                rank = 1;

            }


            const margin = 120;


            let x =
                Math.random() < 0.5
                    ? camera.x - margin
                    : camera.x +
                      width +
                      margin;


            let y =
                Math.random() *
                (
                    WORLD_HEIGHT -
                    SAND_HEIGHT -
                    80
                );


            x =
                Math.max(
                    50,
                    Math.min(
                        WORLD_WIDTH - 50,
                        x
                    )
                );


            y =
                Math.max(
                    50,
                    y
                );


            const dir =
                Math.random() *
                Math.PI *
                2;


            /*
             * NPC war vorher:
             * 3.8 - rank * 0.4
             *
             * Jetzt 25 % langsamer.
             */

            const baseSpeed =
                Math.max(
                    1.5,
                    3.8 -
                    rank * 0.4
                );


            const spd =
                baseSpeed * 0.75;


            fishes.push({

                x: x,

                y: y,

                rank: rank,

                radius:
                    RANKS[rank].radius,

                speed: spd,

                angle: dir,

                targetAngle: dir,

                turnTimer:
                    Math.random() *
                    100,

                cycle:
                    Math.random() *
                    10

            });

        }



        /* =====================================================
           UPDATE
           ===================================================== */

        function update() {

            if (!isGameRunning) {
                return;
            }


            player.x +=
                player.vx;


            player.y +=
                player.vy;


            player.x =
                Math.max(
                    30,
                    Math.min(
                        WORLD_WIDTH - 30,
                        player.x
                    )
                );


            player.y =
                Math.max(
                    30,
                    Math.min(
                        WORLD_HEIGHT -
                        SAND_HEIGHT,
                        player.y
                    )
                );


            let diff =
                player.targetAngle -
                player.angle;


            while (
                diff < -Math.PI
            ) {

                diff +=
                    Math.PI * 2;

            }


            while (
                diff > Math.PI
            ) {

                diff -=
                    Math.PI * 2;

            }


            player.angle +=
                diff * 0.15;


            camera.x =
                player.x -
                width / 2;


            camera.y =
                player.y -
                height / 2;



            /* Blasen */

            bubbles.forEach(
                b => {

                    b.y -=
                        b.speed;


                    b.wobble +=
                        0.05;


                    b.x +=
                        Math.sin(
                            b.wobble
                        ) *
                        0.4;


                    if (
                        b.y < 0
                    ) {

                        b.y =
                            WORLD_HEIGHT;


                        b.x =
                            Math.random() *
                            WORLD_WIDTH;

                    }

                }
            );



            /* Fische auffüllen */

            while (
                fishes.length <
                MAX_FISHES
            ) {

                spawnFish();

            }



            const pRad =
                RANKS[
                    player.rank
                ].radius;



            /* NPC-Fische */

            for (
                let i =
                    fishes.length - 1;

                i >= 0;

                i--
            ) {

                let f =
                    fishes[i];


                f.turnTimer--;


                if (
                    f.turnTimer <= 0
                ) {

                    f.turnTimer =
                        100 +
                        Math.random() *
                        200;


                    if (
                        Math.random() <
                        0.25
                    ) {

                        f.targetAngle =
                            f.angle +
                            (
                                Math.random() -
                                0.5
                            ) *
                            0.8;

                    }

                }


                let fDiff =
                    f.targetAngle -
                    f.angle;


                while (
                    fDiff <
                    -Math.PI
                ) {

                    fDiff +=
                        Math.PI * 2;

                }


                while (
                    fDiff >
                    Math.PI
                ) {

                    fDiff -=
                        Math.PI * 2;

                }


                f.angle +=
                    fDiff *
                    0.05;


                f.vx =
                    Math.cos(
                        f.angle
                    ) *
                    f.speed;


                f.vy =
                    Math.sin(
                        f.angle
                    ) *
                    f.speed;


                f.x +=
                    f.vx;


                f.y +=
                    f.vy;


                f.cycle +=
                    0.08;



                /* Weltgrenzen */

                if (
                    f.x < 30 ||
                    f.x >
                    WORLD_WIDTH - 30
                ) {

                    f.targetAngle =
                        Math.PI -
                        f.angle;

                    f.angle =
                        f.targetAngle;

                }


                if (
                    f.y < 30 ||
                    f.y >
                    WORLD_HEIGHT -
                    SAND_HEIGHT
                ) {

                    f.targetAngle =
                        -f.angle;

                    f.angle =
                        f.targetAngle;

                }



                /* Kollision */

                const dist =
                    Math.hypot(
                        player.x -
                        f.x,

                        player.y -
                        f.y
                    );


                if (
                    dist <
                    pRad +
                    f.radius *
                    0.7
                ) {

                    /*
                     * Spieler kann gleich große
                     * oder kleinere Fische essen.
                     */

                    if (
                        player.rank >=
                        f.rank
                    ) {

                        score +=
                            (
                                f.rank +
                                1
                            ) *
                            10;


                        player.exp +=
                            1;


                        fishes.splice(
                            i,
                            1
                        );


                        if (
                            player.exp >=
                            RANKS[
                                player.rank
                            ].expNeeded &&

                            player.rank <
                            RANKS.length - 1
                        ) {

                            player.exp = 0;

                            player.rank++;

                        }


                        updateHUD();

                    }

                    else {

                        gameOver();

                        return;

                    }

                }

            }

        }

        /* =====================================================
           FISCH ZEICHNEN
           ===================================================== */

        function drawFish(
            x,
            y,
            rankIndex,
            angle,
            cycle
        ) {

            const screenX =
                x -
                camera.x;


            const screenY =
                y -
                camera.y;


            const rank =
                RANKS[
                    rankIndex
                ];


            const radius =
                rank.radius;


            if (
                screenX <
                    -radius * 3 ||

                screenX >
                    width +
                    radius * 3 ||

                screenY <
                    -radius * 3 ||

                screenY >
                    height +
                    radius * 3
            ) {

                return;

            }


            ctx.save();


            ctx.translate(
                screenX,
                screenY
            );


            ctx.rotate(angle);


            ctx.lineJoin =
                'round';


            ctx.lineCap =
                'round';


            const wiggle =
                Math.sin(
                    cycle
                ) *
                0.08;



            /* =================================================
               RANG 0
               KLEINSTER FISCH
               ================================================= */

            if (
                rankIndex === 0
            ) {

                const r = 18;


                /* Schwanz */

                ctx.beginPath();

                ctx.moveTo(
                    -r * 0.55,
                    0
                );

                ctx.lineTo(
                    -r * 1.15,
                    -r * 0.55
                );

                ctx.lineTo(
                    -r * 1.05,
                    0
                );

                ctx.lineTo(
                    -r * 1.15,
                    r * 0.55
                );

                ctx.closePath();


                ctx.fillStyle =
                    rank.color;

                ctx.fill();


                ctx.strokeStyle =
                    rank.darkColor;

                ctx.lineWidth = 2;

                ctx.stroke();



                /* Körper */

                ctx.beginPath();

                ctx.ellipse(
                    0,
                    0,
                    r * 0.8,
                    r * 0.42,
                    0,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    rank.color;

                ctx.fill();


                ctx.strokeStyle =
                    rank.darkColor;

                ctx.stroke();



                /* Auge */

                ctx.beginPath();

                ctx.arc(
                    r * 0.45,
                    -r * 0.12,
                    2.5,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    '#111';

                ctx.fill();

            }



            /* =================================================
               RANG 1
               LÄNGLICHER FISCH
               ================================================= */

            else if (
                rankIndex === 1
            ) {

                const r = 26;


                /* Schwanz */

                ctx.beginPath();

                ctx.moveTo(
                    -r * 0.65,
                    0
                );

                ctx.lineTo(
                    -r * 1.25,
                    -r * 0.55
                );

                ctx.lineTo(
                    -r * 1.15,
                    0
                );

                ctx.lineTo(
                    -r * 1.25,
                    r * 0.55
                );

                ctx.closePath();


                ctx.fillStyle =
                    rank.color;

                ctx.fill();


                ctx.strokeStyle =
                    rank.darkColor;

                ctx.lineWidth = 2;

                ctx.stroke();



                /* Körper */

                ctx.beginPath();

                ctx.ellipse(
                    0,
                    0,
                    r * 1.15,
                    r * 0.38,
                    0,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    rank.color;

                ctx.fill();


                ctx.strokeStyle =
                    rank.darkColor;

                ctx.stroke();



                /* Rückenflosse */

                ctx.beginPath();

                ctx.moveTo(
                    -r * 0.05,
                    -r * 0.3
                );

                ctx.lineTo(
                    r * 0.15,
                    -r * 0.7
                );

                ctx.lineTo(
                    r * 0.35,
                    -r * 0.3
                );

                ctx.closePath();


                ctx.fillStyle =
                    rank.darkColor;

                ctx.fill();



                /* Auge */

                ctx.beginPath();

                ctx.arc(
                    r * 0.75,
                    -r * 0.12,
                    3,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    '#111';

                ctx.fill();

            }



            /* =================================================
               RANG 2
               RAUBFISCH
               ================================================= */

            else if (
                rankIndex === 2
            ) {

                const r = 38;


                /* Schwanz */

                ctx.beginPath();

                ctx.moveTo(
                    -r * 0.65,
                    0
                );

                ctx.lineTo(
                    -r * 1.25,
                    -r * 0.65
                );

                ctx.lineTo(
                    -r * 1.15,
                    0
                );

                ctx.lineTo(
                    -r * 1.25,
                    r * 0.65
                );

                ctx.closePath();


                ctx.fillStyle =
                    rank.darkColor;

                ctx.fill();


                ctx.strokeStyle =
                    rank.darkColor;

                ctx.stroke();



                /* Körper */

                ctx.beginPath();

                ctx.moveTo(
                    -r * 0.75,
                    0
                );

                ctx.quadraticCurveTo(
                    -r * 0.2,
                    -r * 0.55,
                    r * 0.75,
                    -r * 0.22
                );

                ctx.quadraticCurveTo(
                    r,
                    0,
                    r * 0.75,
                    r * 0.22
                );

                ctx.quadraticCurveTo(

                );

                ctx.closePath();


                ctx.fillStyle =
                    rank.color;

                ctx.fill();


                ctx.strokeStyle =
                    rank.darkColor;

                /* Rückenflosse */

                    -r * 0.05,

                );

                ctx.lineTo(
                    r * 0.15,
                    -r * 0.8
                );

                ctx.lineTo(

                );

                ctx.fillStyle =

                ctx.fill();



                /* Untere Flosse */

                ctx.beginPath();

                ctx.moveTo(
                    -r * 0.1,
                    r * 0.3
                );

                ctx.lineTo(
                    r * 0.1,
                    r * 0.75
                );

                ctx.lineTo(
                    r * 0.35,

                );

                ctx.fillStyle =

                );

                /* Kiemen */

                );

                );


                ctx.strokeStyle =

            }



            /* =================================================
               RANG 3
               HAI

            else if (
                rankIndex === 3
            ) {

                const r = 54;


                /* Schwanz */

                ctx.beginPath();

                ctx.moveTo(
                    -r * 0.55,

                );

                ctx.lineTo(

                    -r * 0.5,

                    -r * 0.25
                );

                ctx.quadraticCurveTo(
                    r * 0.95,
                    -r * 0.05,
                    r * 0.75,

                );

                ctx.quadraticCurveTo(

                );

                ctx.closePath();

                );

                ctx.lineTo(
                    r * 0.15,

                );

                ctx.lineTo(
                    r * 0.42,
                    -r * 0.3
                );

                ctx.closePath();


                ctx.fillStyle =
                    rank.darkColor;

                ctx.fill();



                /* Seitenflosse */

                ctx.beginPath();

                ctx.moveTo(
                    r * 0.05,
                    r * 0.25
                );

                ctx.lineTo(
                    r * 0.35,
                    r * 0.8
                );

                ctx.lineTo(
                    r * 0.55,
                    r * 0.2
                );

                ctx.closePath();


                ctx.fillStyle =
                    rank.darkColor;

                ctx.fill();



                /* Auge */

                ctx.beginPath();

                ctx.arc(
                    r * 0.6,
                    -r * 0.15,
                    4,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    '#111';

                ctx.fill();



                /* Kiemen */

                ctx.beginPath();

                ctx.moveTo(
                    r * 0.35,
                    -r * 0.25
                );

                ctx.lineTo(
                    r * 0.25,
                    r * 0.22
                );


                ctx.moveTo(
                    r * 0.43,
                    -r * 0.22
                );

                ctx.lineTo(
                    r * 0.33,
                    r * 0.2
                );


                ctx.strokeStyle =
                    rank.darkColor;

                ctx.lineWidth = 2;

                ctx.stroke();

            }



            /* =================================================
               RANG 4
               WALHAI
               ================================================= */

            else if (
                rankIndex === 4
            ) {

                const r = 80;


                /* Schwanz */

                ctx.beginPath();

                ctx.moveTo(
                    -r * 0.6,
                    0
                );

                ctx.lineTo(
                    -r * 1.25,
                    -r * 0.85
                );

                ctx.lineTo(
                    -r * 1.05,
                    0
                );

                ctx.lineTo(
                    -r * 1.25,
                    r * 0.85
                );

                ctx.closePath();


                ctx.fillStyle =
                    rank.darkColor;

                ctx.fill();


                ctx.strokeStyle =
                    rank.darkColor;

                ctx.lineWidth = 2;

                ctx.stroke();



                /* Walhai-Körper */

                ctx.beginPath();

                ctx.moveTo(
                    -r * 0.75,
                    0
                );

                ctx.quadraticCurveTo(
                    -r * 0.4,
                    -r * 0.65,
                    r * 0.55,
                    -r * 0.38
                );

                ctx.quadraticCurveTo(
                    r * 0.95,
                    -r * 0.15,
                    r * 0.95,
                    0
                );

                ctx.quadraticCurveTo(
                    r * 0.9,
                    r * 0.2,
                    r * 0.45,
                    r * 0.35
                );

                ctx.quadraticCurveTo(
                    -r * 0.4,
                    r * 0.65,
                    -r * 0.75,
                    0
                );

                ctx.closePath();


                ctx.fillStyle =
                    rank.color;

                ctx.fill();


                ctx.strokeStyle =
                    rank.darkColor;

                ctx.lineWidth = 2;

                ctx.stroke();



                /* Rückenflosse */

                ctx.beginPath();

                ctx.moveTo(
                    -r * 0.05,
                    -r * 0.35
                );

                ctx.lineTo(
                    r * 0.15,
                    -r
                );

                ctx.lineTo(
                    r * 0.45,
                    -r * 0.35
                );

                ctx.closePath();


                ctx.fillStyle =
                    rank.darkColor;

                ctx.fill();



                /* Untere Flosse */

                ctx.beginPath();

                ctx.moveTo(
                    -r * 0.05,
                    r * 0.35
                );

                ctx.lineTo(
                    r * 0.25,
                    r * 0.9
                );

                ctx.lineTo(
                    r * 0.48,
                    r * 0.28
                );

                ctx.closePath();


                ctx.fillStyle =
                    rank.darkColor;

                ctx.fill();



                /* Auge */

                ctx.beginPath();

                ctx.arc(
                    r * 0.72,
                    -r * 0.18,
                    5,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    '#111';

                ctx.fill();



                /* Kiemen */

                for (
                    let i = 0;
                    i < 4;
                    i++
                ) {

                    ctx.beginPath();

                    ctx.moveTo(
                        r *
                        (
                            0.48 +
                            i * 0.055
                        ),

                        -r * 0.3
                    );


                    ctx.lineTo(
                        r *
                        (
                            0.44 +
                            i * 0.055
                        ),

                        r * 0.18
                    );


                    ctx.strokeStyle =
                        rank.darkColor;

                    ctx.lineWidth = 2;

                    ctx.stroke();

                }



                /* Walhai-Punkte */

                const spots = [

                    [-0.30, -0.18],
                    [-0.18, -0.30],
                    [-0.05, -0.15],
                    [0.10, -0.28],
                    [0.24, -0.12],
                    [0.38, -0.25],

                    [-0.25, 0.02],
                    [-0.08, 0.10],
                    [0.08, 0.02],
                    [0.22, 0.12],
                    [0.40, 0.02],

                    [-0.32, 0.20],
                    [-0.15, 0.25],
                    [0.02, 0.20],
                    [0.18, 0.28],
                    [0.34, 0.20]

                ];


                spots.forEach(
                    ([sx, sy]) => {

                        ctx.beginPath();

                        ctx.arc(
                            sx * r,
                            sy * r,
                            1.5,
                            0,
                            Math.PI * 2
                        );


                        ctx.fillStyle =
                            rank.darkColor;

                        ctx.fill();

                    }
                );

            }


            ctx.restore();

        }



        /* =====================================================
           SONNENSTRAHLEN
           ===================================================== */

        function drawSunRays() {

            ctx.save();


            const time =
                performance.now() *
                0.0005;


            ctx.fillStyle =
                'rgba(255,255,255,0.08)';


            for (
                let i = 0;
                i < 4;
                i++
            ) {

                ctx.beginPath();


                let xStart =
                    (
                        width / 3
                    ) *
                    i +
                    Math.sin(
                        time + i
                    ) *
                    20;


                ctx.moveTo(
                    xStart,
                    0
                );


                ctx.lineTo(
                    xStart + 100,
                    0
                );


                ctx.lineTo(
                    xStart - 200,
                    height
                );


                ctx.lineTo(
                    xStart - 320,
                    height
                );


                ctx.closePath();


                ctx.fill();

            }


            ctx.restore();

        }



        /* =====================================================
           BACKGROUND
           ===================================================== */

        function drawBackground() {

            ctx.fillStyle =
                '#4a90e2';


            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            drawSunRays();



            /* Blasen */

            ctx.fillStyle =
                'rgba(255,255,255,0.3)';


            bubbles.forEach(
                b => {

                    let bx =
                        b.x -
                        camera.x;


                    let by =
                        b.y -
                        camera.y;


                    if (
                        bx >= 0 &&
                        bx <= width &&
                        by >= 0 &&
                        by <= height
                    ) {

                        ctx.beginPath();


                        ctx.arc(
                            bx,
                            by,
                            b.r,
                            0,
                            Math.PI * 2
                        );


                        ctx.fill();

                    }

                }
            );



            /* Sand */

            const sandY =
                WORLD_HEIGHT -
                SAND_HEIGHT -
                camera.y;


            if (
                sandY < height
            ) {

                /*
                 * Pflanzen
                 */

                ctx.fillStyle =
                    '#10ac84';


                plants.forEach(
                    p => {

                        let px =
                            p.x -
                            camera.x;


                        if (
                            px >= -30 &&
                            px <=
                            width + 30
                        ) {

                            for (
                                let i = 0;
                                i <
                                p.blades;
                                i++
                            ) {

                                ctx.fillRect(
                                    px +
                                    (
                                        i *
                                        8
                                    ),

                                    sandY -
                                    p.height,

                                    4,

                                    p.height
                                );

                            }

                        }

                    }
                );


                /*
                 * Sandboden
                 */

                ctx.fillStyle =
                    '#e5c158';


                ctx.fillRect(
                    0,
                    sandY,
                    width,
                    height -
                    sandY
                );

            }

        }



        /* =====================================================
           DRAW
           ===================================================== */

        function draw() {

            drawBackground();


            fishes.forEach(
                f => {

                    drawFish(
                        f.x,
                        f.y,
                        f.rank,
                        f.angle,
                        f.cycle
                    );

                }
            );


            if (
                isGameRunning
            ) {

                drawFish(
                    player.x,
                    player.y,
                    player.rank,
                    player.angle,
                    performance.now() *
                    0.01
                );

            }

        }



        /* =====================================================
           GAME OVER
           ===================================================== */

        function gameOver() {

            if (!isGameRunning) {
                return;
            }


            isGameRunning = false;


            touchActive = false;


            player.vx = 0;
            player.vy = 0;


            joystickContainer.style.display =
                'none';


            joystickKnob.style.transform =
                'translate(-50%, -50%)';


            stopMusic();


            /*
             * Highscore speichern
             */

            saveScoreOnline(
                playerName,
                score
            );


            /*
             * Letzten Score anzeigen
             */

            document
                .getElementById(
                    'lastScoreBox'
                )
                .classList.remove(
                    'hidden'
                );


            document
                .getElementById(
                    'lastScoreVal'
                )
                .innerText =
                score;


            /*
             * HUD ausblenden
             */

            document
                .getElementById(
                    'uiOverlay'
                )
                .classList.add(
                    'hidden'
                );


            /*
             * End-Button ausblenden
             */

            document
                .getElementById(
                    'pauseButton'
                )
                .classList.add(
                    'hidden'
                );


            /*
             * Hauptmenü wieder anzeigen
             */

            document
                .getElementById(
                    'startMenu'
                )
                .classList.remove(
                    'hidden'
                );

        }



        /* =====================================================
           MANUELL SPIEL BEENDEN
           ===================================================== */

        function endGameManually() {

            if (!isGameRunning) {
                return;
            }


            /*
             * Runde sofort beenden.
             *
             * Der aktuelle Score wird gespeichert.
             */

            gameOver();

        }



        /* =====================================================
           START GAME
           ===================================================== */

        async function startGame() {

            const input =
                document
                    .getElementById(
                        'playerNameInput'
                    )
                    .value
                    .trim();


            if (!input) {

                alert(
                    "Bitte gib deinen Namen ein!"
                );

                return;

            }


            playerName =
                input;


            localStorage.setItem(
                'fishup_player_name',
                playerName
            );


            /*
             * WICHTIG:
             *
             * Hauptmenü wird KOMPLETT
             * versteckt.
             *
             * Nicht nur hinter das Spiel
             * geschoben.
             */

            document
                .getElementById(
                    'startMenu'
                )
                .classList.add(
                    'hidden'
                );


            document
                .getElementById(
                    'settingsModal'
                )
                .classList.add(
                    'hidden'
                );


            /*
             * Spiel zurücksetzen
             */

            isGameRunning = true;


            score = 0;


            player.x =
                WORLD_WIDTH / 2;


            player.y =
                WORLD_HEIGHT / 2;


            player.rank = 0;


            player.exp = 0;


            player.vx = 0;


            player.vy = 0;


            player.angle = 0;


            player.targetAngle = 0;


            camera.x =
                player.x -
                width / 2;


            camera.y =
                player.y -
                height / 2;


            fishes = [];


            /*
             * HUD
             */

            updateHUD();


            document
                .getElementById(
                    'uiOverlay'
                )
                .classList.remove(
                    'hidden'
                );


            /*
             * End-Button
             */

            document
                .getElementById(
                    'pauseButton'
                )
                .classList.remove(
                    'hidden'
                );


            /*
             * Musik
             */

            startMusic();

        }



        /* =====================================================
           GAME LOOP
           ===================================================== */

        let lastTime =
            performance.now();


        function loop(now) {

            const dt =
                now -
                lastTime;


            if (
                dt >=
                1000 /
                targetFPS
            ) {

                update();

                draw();


                lastTime =
                    now -
                    (
                        dt %
                        (
                            1000 /
                            targetFPS
                        )
                    );

            }


            requestAnimationFrame(
                loop
            );

        }


        requestAnimationFrame(
            loop
        );


    </script>
