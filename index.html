<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fishup">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#00b4db">
    <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/fish-emoji.png">
    <title>Fishup - Mobile Online</title>
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #00b4db;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #gameCanvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(0, 180, 219, 0.92) 0%, rgba(0, 95, 140, 0.95) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            padding: 20px;
        }
        .hidden { display: none !important; }

        h1 {
            font-size: 38px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            letter-spacing: 2px;
            font-weight: 900;
        }
        h2 { font-size: 22px; margin-bottom: 15px; color: #ffd700; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 280px;
            margin-bottom: 20px;
        }
        .input-group label { font-size: 13px; color: #e0f7fc; text-align: center; font-weight: 600; }
        .input-group input {
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid #ffffff;
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 18px;
            text-align: center;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .input-group input::placeholder { color: rgba(255,255,255,0.7); }

        .menu-btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 280px;
        }
        .btn {
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 126, 95, 0.4);
            text-align: center;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }

        .card {
            background: rgba(0, 60, 100, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 15px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 12px;
            backdrop-filter: blur(5px);
        }

        .setting-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .setting-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
        }
        .volume-slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            accent-color: #ffd700;
            cursor: pointer;
        }

        /* HUD OVERLAY */
        #uiOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%;
            pointer-events: none;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hud-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .hud-level-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 70, 120, 0.7);
            border: 2px solid #ffd700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border-radius: 25px;
            padding: 4px 12px 4px 6px;
            color: #fff;
            backdrop-filter: blur(4px);
        }
        .hud-level-circle {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 16px; color: #000;
        }
        .hud-level-name {
            font-size: 13px; font-weight: bold; color: #ffffff; text-transform: uppercase;
        }

        .hud-xp-container {
            flex: 1;
            max-width: 120px;
            margin: 0 6px;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 15px;
            height: 18px;
            overflow: hidden;
            position: relative;
        }
        .hud-xp-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
            transition: width 0.2s ease-out;
        }

        .hud-right-group {
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: auto;
        }

        .hud-score-box {
            background: rgba(0, 70, 120, 0.7);
            border: 2px solid #ffffff;
            border-radius: 20px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            backdrop-filter: blur(4px);
        }
        .hud-score-p-icon {
            width: 22px; height: 22px;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            border: 1.5px solid #ffffff;
            border-radius: 50%;
            color: #000;
            font-weight: 900;
            font-size: 12px;
            font-family: sans-serif;
            display: flex; align-items: center; justify-content: center;
        }
        .hud-score-val { color: #ffffff; font-weight: 900; font-size: 16px; }

        .hud-icon-btn {
            background: rgba(0, 70, 120, 0.8);
            border: 2px solid #ffffff;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            backdrop-filter: blur(4px);
        }

        .hud-banner {
            align-self: center;
            background: rgba(0, 50, 90, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            padding: 6px 16px;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            backdrop-filter: blur(4px);
        }

        .leaderboard-list { list-style: none; font-size: 13px; width: 100%; margin-top: 10px; }
        .leaderboard-item { display: flex; justify-content: space-between; margin-bottom: 5px; padding: 4px 8px; background: rgba(255,255,255,0.15); border-radius: 6px; }
        .leaderboard-item.highlight { color: #ffd700; font-weight: bold; background: rgba(255, 215, 0, 0.25); }

        #joystickContainer {
            position: absolute;
            bottom: 40px; left: 40px;
            width: 100px; height: 100px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: auto;
            display: none;
        }
        #joystickKnob {
            position: absolute;
            top: 50%; left: 50%;
            width: 40px; height: 40px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            will-change: transform;
        }
    </style>
</head>
<body>

    <!-- HAUPTMENÜ -->
    <div id="startMenu" class="modal-overlay">
        <h1>FISHUP</h1>
        <div id="lastScoreBox" class="card hidden" style="text-align: center; max-width: 280px; padding: 10px;">
            <span style="font-size: 12px; color: #e0f7fc;">Letzter Score:</span>
            <div id="lastScoreVal" style="font-size: 20px; font-weight: bold; color: #ffd700;">0</div>
        </div>
        <div class="input-group">
            <label for="playerNameInput">DEIN SPIELERNAME:</label>
            <input type="text" id="playerNameInput" maxlength="12" placeholder="Name...">
        </div>
        <div class="menu-btn-group">
            <button class="btn" onclick="startGame()">Spielen</button>
            <button class="btn btn-secondary" onclick="openSettings('startMenu')">⚙️ Einstellungen</button>
        </div>

        <div class="card" style="max-width: 280px; margin-top: 15px;">
            <div style="font-size: 12px; font-weight: bold; color: #ffd700; text-align: center;">🏆 TOP 5 HIGH SCORES</div>
            <ul id="leaderboardList" class="leaderboard-list">
                <li class="leaderboard-item"><span>Lade...</span></li>
            </ul>
        </div>
    </div>

    <!-- PAUSE MENÜ -->
    <div id="pauseModal" class="modal-overlay hidden">
        <h2>PAUSE</h2>
        <div class="menu-btn-group">
            <button class="btn" onclick="resumeGame()">Fortsetzen</button>
            <button class="btn btn-secondary" onclick="openSettings('pauseModal')">⚙️ Einstellungen</button>
            <button class="btn btn-danger" onclick="quitToMainMenu()">Hauptmenü</button>
        </div>
    </div>

    <!-- EINSTELLUNGEN -->
    <div id="settingsModal" class="modal-overlay hidden">
        <h2>EINSTELLUNGEN</h2>
        <div class="card">
            <div class="setting-row">
                <div class="setting-label">
                    <span>🎵 Musiklautstärke</span>
                    <span id="volumeVal">50%</span>
                </div>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="50" oninput="updateVolume(this.value)">
            </div>
            <div style="font-size: 13px; font-weight: bold; margin-bottom: 8px;">PERFORMANCE</div>
            <div class="menu-btn-group" style="max-width: 100%;">
                <button id="btn30fps" class="btn btn-secondary" onclick="setFPS(30)">🔋 30 FPS</button>
                <button id="btn60fps" class="btn" onclick="setFPS(60)">⚡ MAX FPS</button>
            </div>
        </div>
        <button class="btn btn-secondary" onclick="closeSettings()">Zurück</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- BUNTE HUD -->
    <div id="uiOverlay" class="hidden">
        <div class="hud-top-row">
            <div class="hud-level-badge">
                <div class="hud-level-circle" id="hudLvlNum">0</div>
                <div class="hud-level-name" id="hudLvlName">Grau</div>
            </div>

            <div class="hud-xp-container">
                <div class="hud-xp-bar" id="hudXpBar"></div>
            </div>

            <div class="hud-right-group">
                <div class="hud-score-box">
                    <div class="hud-score-p-icon">P</div>
                    <span class="hud-score-val" id="scoreVal">0</span>
                </div>
                <button class="hud-icon-btn" onclick="pauseGame()">⏸️</button>
            </div>
        </div>

        <div class="hud-banner">
            ISS KLEINERE FISCHE, UM GRÖSSER ZU WERDEN!
        </div>
    </div>

    <div id="joystickContainer">
        <div id="joystickKnob"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBTXBIaZsXWpDaigQAPBiOwuXouz2UlcyQ",
            authDomain: "fishup-9bc99.firebaseapp.com",
            projectId: "fishup-9bc99",
            storageBucket: "fishup-9bc99.firebasestorage.app",
            messagingSenderId: "366958128305",
            appId: "1:366958128305:web:f74d82c3c7d9c980f10690",
            databaseURL: "https://fishup-9bc99-default-rtdb.europe-west1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

        // LEVELEINSTELLUNGEN (+7 Fische pro Stufe angepasst)
        const RANKS = [
            { id: 0, name: 'Grau', color: '#7f8c8d', darkColor: '#34495e', radius: 18, expNeeded: 11 },
            { id: 1, name: 'Grün', color: '#2ecc71', darkColor: '#27ae60', radius: 26, expNeeded: 16 },
            { id: 2, name: 'Blau', color: '#3498db', darkColor: '#2980b9', radius: 38, expNeeded: 25 },
            { id: 3, name: 'Lila', color: '#9b59b6', darkColor: '#8e44ad', radius: 54, expNeeded: 36 },
            { id: 4, name: 'Gold', color: '#f1c40f', darkColor: '#d35400', radius: 80, expNeeded: 47 }
        ];

        const WORLD_WIDTH = 3200;
        const WORLD_HEIGHT = 2400;
        const SAND_HEIGHT = 100;
        const MAX_FISHES = 105;

        let width, height;
        let camera = { x: 0, y: 0 };
        let isGameRunning = false;
        let isPaused = false;
        let score = 0;
        let targetFPS = 60;
        let previousModal = 'startMenu';

        let playerName = localStorage.getItem('fishup_player_name') || '';
        document.getElementById('playerNameInput').value = playerName;

        // AUDIO SYSTEM
        let audioCtx = null;
        let mainGainNode = null;
        let musicVolume = 0.5;
        let isMusicPlaying = false;
        let musicTimer = null;

        const MELODY_NOTES = [
            { note: "E5", duration: 0.18 }, { note: "B4", duration: 0.18 }, { note: "C5", duration: 0.18 }, { note: "D5", duration: 0.18 },
            { note: "C5", duration: 0.18 }, { note: "B4", duration: 0.18 }, { note: "A4", duration: 0.18 }, { note: "A4", duration: 0.18 },
            { note: "C5", duration: 0.18 }, { note: "E5", duration: 0.18 }, { note: "D5", duration: 0.18 }, { note: "C5", duration: 0.18 },
            { note: "B4", duration: 0.28 }, { note: "C5", duration: 0.18 }, { note: "D5", duration: 0.18 }, { note: "E5", duration: 0.28 },
            { note: "C5", duration: 0.28 }, { note: "A4", duration: 0.28 }, { note: "A4", duration: 0.4 },
            
            { note: "D5", duration: 0.22 }, { note: "F5", duration: 0.18 }, { note: "A5", duration: 0.18 }, { note: "G5", duration: 0.18 },
            { note: "F5", duration: 0.18 }, { note: "E5", duration: 0.28 }, { note: "C5", duration: 0.18 }, { note: "E5", duration: 0.18 },
            { note: "D5", duration: 0.18 }, { note: "C5", duration: 0.18 }, { note: "B4", duration: 0.22 }, { note: "B4", duration: 0.18 },
            { note: "C5", duration: 0.18 }, { note: "D5", duration: 0.28 }, { note: "E5", duration: 0.28 }, { note: "C5", duration: 0.28 },
            { note: "A4", duration: 0.28 }, { note: "A4", duration: 0.4 }
        ];

        function getNoteFrequency(note) {
            const notes = {
                "A4": 440.00, "B4": 493.88, "C5": 523.25, "D5": 587.33,
                "E5": 659.25, "F5": 698.46, "G5": 783.99, "A5": 880.00
            };
            return notes[note] || 440;
        }

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                mainGainNode = audioCtx.createGain();
                mainGainNode.gain.setValueAtTime(musicVolume, audioCtx.currentTime);
                mainGainNode.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, duration) {
            if (!audioCtx || musicVolume <= 0 || isPaused) return;
            try {
                const osc = audioCtx.createOscillator();
                const noteGain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                noteGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                noteGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration - 0.02);

                osc.connect(noteGain);
                noteGain.connect(mainGainNode);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function startMusic() {
            initAudio();
            if (isMusicPlaying) return;
            isMusicPlaying = true;

            let step = 0;
            function playNextNote() {
                if (!isMusicPlaying) return;
                const noteData = MELODY_NOTES[step];
                playTone(getNoteFrequency(noteData.note), noteData.duration);
                step = (step + 1) % MELODY_NOTES.length;
                musicTimer = setTimeout(playNextNote, noteData.duration * 1000);
            }
            playNextNote();
        }

        function stopMusic() {
            isMusicPlaying = false;
            if (musicTimer) clearTimeout(musicTimer);
        }

        function updateVolume(val) {
            musicVolume = val / 100;
            document.getElementById('volumeVal').innerText = val + '%';
            if (mainGainNode && audioCtx) {
                mainGainNode.gain.setValueAtTime(musicVolume, audioCtx.currentTime);
            }
        }

        let player = {
            x: WORLD_WIDTH / 2,
            y: WORLD_HEIGHT / 2,
            rank: 0,
            exp: 0,
            vx: 0, vy: 0,
            speed: 3.5,
            angle: 0,
            targetAngle: 0
        };

        let fishes = [];
        let bubbles = [];
        let plants = [];

        for(let x = 100; x < WORLD_WIDTH; x += 220 + Math.random() * 200) {
            plants.push({
                x: x,
                height: 120 + Math.random() * 80,
                blades: 3 + Math.floor(Math.random() * 3)
            });
        }

        for(let i = 0; i < 30; i++) {
            bubbles.push({
                x: Math.random() * WORLD_WIDTH,
                y: Math.random() * WORLD_HEIGHT,
                r: 2 + Math.random() * 4,
                speed: 0.5 + Math.random() * 0.8,
                wobble: Math.random() * Math.PI * 2
            });
        }

        let touchActive = false;
        let touchStartPos = { x: 0, y: 0 };
        let touchCurrentPos = { x: 0, y: 0 };
        const joystickContainer = document.getElementById('joystickContainer');
        const joystickKnob = document.getElementById('joystickKnob');

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function listenToOnlineLeaderboard() {
            database.ref('highscores').orderByChild('score').limitToLast(5).on('value', (snapshot) => {
                let scores = [];
                snapshot.forEach((child) => { scores.push(child.val()); });
                scores.reverse();
                renderLeaderboardUI(scores);
            });
        }

        function renderLeaderboardUI(list) {
            const listEl = document.getElementById('leaderboardList');
            listEl.innerHTML = '';
            if (list.length === 0) {
                listEl.innerHTML = '<li class="leaderboard-item">Noch keine Rekorde</li>';
                return;
            }
            list.forEach((item, i) => {
                const li = document.createElement('li');
                li.className = `leaderboard-item ${item.name === playerName ? 'highlight' : ''}`;
                li.innerHTML = `<span>${i + 1}. ${item.name}</span><span>${item.score}</span>`;
                listEl.appendChild(li);
            });
        }

        function saveScoreOnline(name, finalScore) {
            if (!name || finalScore <= 0) return;
            const userRef = database.ref('highscores/' + name);
            userRef.once('value', (snapshot) => {
                const data = snapshot.val();
                if (!data || finalScore > data.score) {
                    userRef.set({ name: name, score: finalScore });
                }
            });
        }

        listenToOnlineLeaderboard();

        function hideAllModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.add('hidden'));
        }

        function openSettings(fromModal) {
            previousModal = fromModal;
            hideAllModals();
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            hideAllModals();
            if (previousModal) {
                document.getElementById(previousModal).classList.remove('hidden');
            }
        }

        function pauseGame() {
            if (!isGameRunning || isPaused) return;
            isPaused = true;
            hideAllModals();
            document.getElementById('pauseModal').classList.remove('hidden');
        }

        function resumeGame() {
            isPaused = false;
            hideAllModals();
        }

        function quitToMainMenu() {
            isGameRunning = false;
            isPaused = false;
            stopMusic();
            saveScoreOnline(playerName, score);
            
            document.getElementById('uiOverlay').classList.add('hidden');
            hideAllModals();
            document.getElementById('startMenu').classList.remove('hidden');
        }

        function setFPS(fps) {
            targetFPS = fps;
            document.getElementById('btn30fps').className = fps === 30 ? 'btn' : 'btn btn-secondary';
            document.getElementById('btn60fps').className = fps === 60 ? 'btn' : 'btn btn-secondary';
        }

        window.addEventListener('touchstart', e => {
            if (!isGameRunning || isPaused) return;
            if (e.target.closest('#uiOverlay')) return;
            touchActive = true;
            const t = e.touches[0];
            touchStartPos = { x: t.clientX, y: t.clientY };
            touchCurrentPos = { x: t.clientX, y: t.clientY };
            joystickContainer.style.display = 'block';
            updateJoystick();
        }, { passive: false });

        window.addEventListener('touchmove', e => {
            if (!touchActive || isPaused) return;
            const t = e.touches[0];
            touchCurrentPos = { x: t.clientX, y: t.clientY };
            updateJoystick();
        }, { passive: false });

        window.addEventListener('touchend', () => {
            touchActive = false;
            player.vx = 0; player.vy = 0;
            joystickContainer.style.display = 'none';
        });

        function updateJoystick() {
            const dx = touchCurrentPos.x - touchStartPos.x;
            const dy = touchCurrentPos.y - touchStartPos.y;
            const dist = Math.hypot(dx, dy);
            const maxR = 40;
            const angle = Math.atan2(dy, dx);
            const moveD = Math.min(dist, maxR);

            const kX = Math.cos(angle) * moveD;
            const kY = Math.sin(angle) * moveD;
            joystickKnob.style.transform = `translate(calc(-50% + ${kX}px), calc(-50% + ${kY}px))`;

            if (dist > 5) {
                const speedMult = Math.min(dist / maxR, 1);
                player.vx = Math.cos(angle) * player.speed * speedMult;
                player.vy = Math.sin(angle) * player.speed * speedMult;
                player.targetAngle = angle;
            } else {
                player.vx = 0; player.vy = 0;
            }
        }

        function spawnFish() {
            const rand = Math.random();
            let rank = 0;
            if (rand < 0.002) rank = 4;        // Gold: 0.2%
            else if (rand < 0.02) rank = 3;    // Lila: 1.8%
            else if (rand < 0.10) rank = 2;    // Blau: 8.0%
            else if (rand < 0.45) rank = 1;    // Grün: 35.0%
            else rank = 0;                     // Grau: 55.0%

            const margin = 120;
            let x = Math.random() < 0.5 ? camera.x - margin : camera.x + width + margin;
            let y = Math.random() * (WORLD_HEIGHT - SAND_HEIGHT - 80);

            x = Math.max(50, Math.min(WORLD_WIDTH - 50, x));
            y = Math.max(50, y);

            const dir = Math.random() * Math.PI * 2;
            const spd = Math.max(0.8, 2.0 - rank * 0.2);

            fishes.push({
                x: x, y: y,
                rank: rank,
                radius: RANKS[rank].radius,
                speed: spd,
                angle: dir,
                targetAngle: dir,
                turnTimer: Math.random() * 100,
                cycle: Math.random() * 10
            });
        }

        function update() {
            if (!isGameRunning || isPaused) return;

            player.x += player.vx;
            player.y += player.vy;
            player.x = Math.max(30, Math.min(WORLD_WIDTH - 30, player.x));
            player.y = Math.max(30, Math.min(WORLD_HEIGHT - SAND_HEIGHT, player.y));

            let diff = player.targetAngle - player.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            player.angle += diff * 0.15;

            camera.x = player.x - width / 2;
            camera.y = player.y - height / 2;

            bubbles.forEach(b => {
                b.y -= b.speed;
                b.wobble += 0.05;
                b.x += Math.sin(b.wobble) * 0.4;
                if (b.y < 0) {
                    b.y = WORLD_HEIGHT;
                    b.x = Math.random() * WORLD_WIDTH;
                }
            });

            while (fishes.length < MAX_FISHES) spawnFish();

            const pRad = RANKS[player.rank].radius;

            for (let i = fishes.length - 1; i >= 0; i--) {
                let f = fishes[i];

                f.turnTimer--;
                if (f.turnTimer <= 0) {
                    f.turnTimer = 100 + Math.random() * 200;
                    if (Math.random() < 0.25) {
                        f.targetAngle = f.angle + (Math.random() - 0.5) * 0.8;
                    }
                }

                let fDiff = f.targetAngle - f.angle;
                while (fDiff < -Math.PI) fDiff += Math.PI * 2;
                while (fDiff > Math.PI) fDiff -= Math.PI * 2;
                f.angle += fDiff * 0.05;

                f.vx = Math.cos(f.angle) * f.speed;
                f.vy = Math.sin(f.angle) * f.speed;

                f.x += f.vx; f.y += f.vy;
                f.cycle += 0.04;

                if (f.x < 30 || f.x > WORLD_WIDTH - 30) {
                    f.targetAngle = Math.PI - f.angle;
                    f.angle = f.targetAngle;
                }
                if (f.y < 30 || f.y > WORLD_HEIGHT - SAND_HEIGHT) {
                    f.targetAngle = -f.angle;
                    f.angle = f.targetAngle;
                }

                const dist = Math.hypot(player.x - f.x, player.y - f.y);
                if (dist < pRad + f.radius * 0.7) {
                    if (player.rank >= f.rank) {
                        score += (f.rank + 1) * 10;
                        player.exp += 1;
                        fishes.splice(i, 1);
                        
                        // EXP LOGIK & AUTOMATISCHES SPIELENDE
                        if (player.exp >= RANKS[player.rank].expNeeded) {
                            if (player.rank < RANKS.length - 1) {
                                player.exp = 0;
                                player.rank++;
                            } else {
                                gameOver();
                                return;
                            }
                        }
                        updateHUD();
                    } else {
                        gameOver();
                        return;
                    }
                }
            }
        }

        function updateHUD() {
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('hudLvlNum').innerText = player.rank;
            document.getElementById('hudLvlName').innerText = RANKS[player.rank].name;

            const needed = RANKS[player.rank].expNeeded;
            let pct = Math.min(100, Math.max(0, (player.exp / needed) * 100));
            document.getElementById('hudXpBar').style.width = pct + '%';
        }

        function drawFish(x, y, rankIndex, angle, cycle) {
            let screenX = x - camera.x;
            let screenY = y - camera.y;
            const rank = RANKS[rankIndex];
            const radius = rank.radius;

            if (screenX < -radius * 2 || screenX > width + radius * 2 ||
                screenY < -radius * 2 || screenY > height + radius * 2) {
                return;
            }

            ctx.save();
            ctx.translate(screenX, screenY);

            let normAngle = angle;
            while (normAngle < -Math.PI) normAngle += Math.PI * 2;
            while (normAngle > Math.PI) normAngle -= Math.PI * 2;
            
            const isFacingLeft = Math.abs(normAngle) > Math.PI / 2;

            if (isFacingLeft) {
                ctx.scale(1, -1);
                ctx.rotate(-angle);
            } else {
                ctx.rotate(angle);
            }

            const tailWiggle = Math.sin(cycle) * 0.2;

            // Schwanzflosse
            ctx.beginPath();
            ctx.fillStyle = rank.darkColor;
            ctx.moveTo(-radius * 0.7, 0);
            ctx.quadraticCurveTo(-radius * 1.3, -radius * 0.6 + tailWiggle * 8, -radius * 1.4, -radius * 0.6 + tailWiggle * 8);
            ctx.quadraticCurveTo(-radius * 1.1, 0, -radius * 1.4, radius * 0.6 + tailWiggle * 8);
            ctx.quadraticCurveTo(-radius * 1.3, radius * 0.6 + tailWiggle * 8, -radius * 0.7, 0);
            ctx.fill();

            // Körper
            ctx.beginPath();
            ctx.fillStyle = rank.color;
            ctx.ellipse(0, 0, radius, radius * 0.55, 0, 0, Math.PI * 2);
            ctx.fill();

            // Kiemen
            if (rankIndex >= 1) {
                ctx.beginPath();
                ctx.strokeStyle = rank.darkColor;
                ctx.lineWidth = 1.5;
                ctx.arc(radius * 0.1, 0, radius * 0.35, Math.PI * 0.7, Math.PI * 1.3);
                ctx.stroke();
            }

            // Auge
            const eyeX = radius * 0.45;
            const eyeY = -radius * 0.2;
            const eyeRadius = Math.max(2.5, radius * 0.15);

            ctx.beginPath();
            ctx.arc(eyeX, eyeY, eyeRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(eyeX + eyeRadius * 0.25, eyeY, eyeRadius * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(eyeX + eyeRadius * 0.1, eyeY - eyeRadius * 0.2, eyeRadius * 0.2, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            ctx.restore();
        }

        function drawSunRays() {
            ctx.save();
            const time = performance.now() * 0.0005;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';

            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                let xStart = (width / 4) * i + Math.sin(time + i) * 30;
                ctx.moveTo(xStart, 0);
                ctx.lineTo(xStart + 120, 0);
                ctx.lineTo(xStart - 180, height);
                ctx.lineTo(xStart - 300, height);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }

        function drawBackground() {
            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#4facfe');
            grad.addColorStop(1, '#00f2fe');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            drawSunRays();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 1;
            bubbles.forEach(b => {
                let bx = b.x - camera.x;
                let by = b.y - camera.y;
                if (bx >= -10 && bx <= width + 10 && by >= -10 && by <= height + 10) {
                    ctx.beginPath();
                    ctx.arc(bx, by, b.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
            });

            const sandY = WORLD_HEIGHT - SAND_HEIGHT - camera.y;
            if (sandY < height) {
                ctx.fillStyle = '#10ac84';
                plants.forEach(p => {
                    let px = p.x - camera.x;
                    if (px >= -30 && px <= width + 30) {
                        for(let i = 0; i < p.blades; i++) {
                            ctx.fillRect(px + (i * 8), sandY - p.height, 5, p.height);
                        }
                    }
                });

                ctx.fillStyle = '#f6d365';
                ctx.fillRect(0, sandY, width, height - sandY);
            }
        }

        function draw() {
            drawBackground();
            fishes.forEach(f => drawFish(f.x, f.y, f.rank, f.angle, f.cycle));
            if (isGameRunning) {
                drawFish(player.x, player.y, player.rank, player.angle, performance.now() * 0.005);
            }
        }

        function gameOver() {
            isGameRunning = false;
            isPaused = false;
            stopMusic();
            saveScoreOnline(playerName, score);

            document.getElementById('lastScoreBox').classList.remove('hidden');
            document.getElementById('lastScoreVal').innerText = score;
            document.getElementById('uiOverlay').classList.add('hidden');

            hideAllModals();
            document.getElementById('startMenu').classList.remove('hidden');
        }

        function startGame() {
            const input = document.getElementById('playerNameInput').value.trim();
            if (!input) {
                alert("Bitte gib deinen Namen ein!");
                return;
            }
            playerName = input;
            localStorage.setItem('fishup_player_name', playerName);

            hideAllModals();
            document.getElementById('uiOverlay').classList.remove('hidden');

            isGameRunning = true;
            isPaused = false;
            score = 0;
            player.x = WORLD_WIDTH / 2;
            player.y = WORLD_HEIGHT / 2;
            player.vx = 0;
            player.vy = 0;
            fishes = [];

            player.rank = 0;
            player.exp = 0;

            updateHUD();
            startMusic();
        }

        let lastTime = performance.now();
        function loop(now) {
            let dt = now - lastTime;
            if (dt >= 1000 / targetFPS) {
                update();
                draw();
                lastTime = now - (dt % (1000 / targetFPS));
            }
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
