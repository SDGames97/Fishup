<!DOCTYPE html>
<html lang="de">
<head>

    <style>

            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            touch-action: none;
        }

        html,

            width: 100%;

        }

        #gameCanvas {
            width: 100vw;

            display: block;
        }

        /* =========================
           MODAL
        ========================= */

        .modal-overlay {
            position: absolute;
            inset: 0;

            background:

                    180deg,
                    rgba(30, 80, 120, 0.88),

            flex-direction: column;

            align-items: center;

            padding: 20px;
        }

            display: none !important;
        }

            font-size: 38px;

        }

            font-size: 22px;

            gap: 8px;

            margin-bottom: 20px;
        }

        .input-group label {
            font-size: 13px;

            text-align: center;
        }

        .input-group input {

            border-radius: 12px;

            text-align: center;

        .menu-btn-group {

            flex-direction: column;
            gap: 12px;

        }

        .btn {
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);

            border-radius: 20px;

            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.3);

        }

        .btn-secondary {

        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4b4b, #c40000);

        }

        .card {
            background: rgba(0, 20, 45, 0.85);

            padding: 15px;

        }

        /* =========================
           SETTINGS
        ========================= */

        .setting-row {
            display: flex;
            flex-direction: column;

        }

        .setting-label {
            display: flex;

        }

            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.2);
            outline: none;

        }

        /* =========================
           HUD
        ========================= */

        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

            pointer-events: none;

            padding: 12px 16px;

            z-index: 20;
        }

        .hud-top-row {
            display: flex;

            align-items: center;
            width: 100%;
        }

        .hud-level-badge {

            align-items: center;

            border: 2px solid #ffd700;

        .hud-level-name {

        .hud-score-val {
            color: #fff;

        }

        .hud-banner {

            font-weight: 600;

            text-align: center;

        /* =========================
           EATABLE FISH PANEL
        ========================= */

        #eatPanel {

            font-weight: 900;

        .eat-row {
            display: flex;

            gap: 5px;

        }

        }

        /* =========================

        ========================= */

        #pauseButton {

            border: 2px solid rgba(255,255,255,0.6);

            font-weight: bold;

        ========================= */

        .leaderboard-item.highlight {

            font-weight: bold;
            background: rgba(0,210,255,0.15);
        }

        /* =========================
           JOYSTICK
        ========================= */

        #joystickContainer {
            position: absolute;

            bottom: 40px;
            left: 40px;

            width: 100px;
            height: 100px;

            background: rgba(255,255,255,0.08);

            border: 2px solid rgba(255,255,255,0.2);

            border-radius: 50%;

            pointer-events: auto;

            display: none;

            z-index: 60;
        }

        #joystickKnob {
            position: absolute;

            top: 50%;
            left: 50%;

            width: 40px;
            height: 40px;

            background: rgba(255,255,255,0.4);

            border-radius: 50%;

            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>

    <!-- =========================
         HAUPTMENÜ
    ========================= -->

    <div id="startMenu" class="modal-overlay">

            <div class="setting-row">

                    onclick="setFPS(60)">

    <!-- =========================
         PAUSE MENÜ
    ========================= -->

    <div
        id="pauseModal"
        class="modal-overlay hidden">

        <h2>⏸ PAUSE</h2>

        <div class="card">

            <div class="setting-row">

                <div class="setting-label">

                    <span>🎵 Musiklautstärke</span>

                    <span id="pauseVolumeVal">
                        50%
                    </span>

                </div>

                <input
                    type="range"
                    id="pauseVolumeSlider"
                    class="volume-slider"
                    min="0"
                    max="100"
                    value="50"
                    oninput="updatePauseVolume(this.value)"

            </div>

            <button
                class="btn"
                style="width:100%;margin-bottom:12px;"
                onclick="resumeGame()">

                ▶️ Weiterspielen

            </button>

            <button

                style="width:100%;"

                🛑 Runde beenden

    <!-- =========================

    ========================= -->

    <!-- =========================
         HUD
    ========================= -->

    <div id="uiOverlay" class="hidden">

        <div class="hud-top-row">

            <div class="hud-level-badge">

                <div
                    class="hud-level-circle"

                </div>

            <div class="hud-xp-container">

                <div
                    class="hud-xp-bar"

                </div>

            <div class="hud-score-box">

<script>

    /* =========================================================
       FIREBASE
    ========================================================= */

    const firebaseConfig = {

        apiKey: "AIzaSyBTXBIaZsXWpDaigQAPBiOwuXouz2UlcyQ",

        authDomain:
            "fishup-9bc99.firebaseapp.com",

        projectId:
            "fishup-9bc99",

        storageBucket:
            "fishup-9bc99.firebasestorage.app",

        messagingSenderId:
            "366958128305",

        appId:
            "1:366958128305:web:f74d82c3c7d9c980f10690",

        databaseURL:
            "https://fishup-9bc99-default-rtdb.europe-west1.firebasedatabase.app"
    };


    firebase.initializeApp(firebaseConfig);

    const database =
        firebase.database();


    /* =========================================================
       CANVAS
    ========================================================= */

    const canvas =
        document.getElementById('gameCanvas');

    const ctx =
        canvas.getContext(
            '2d',
            {
                alpha: false,
                desynchronized: true
            }
        );


    /* =========================================================
       RÄNGE
    ========================================================= */

    const RANKS = [

        {
            id: 0,
            name: 'Grau',
            color: '#9aa5ad',
            darkColor: '#59636a',
            radius: 18,
            expNeeded: 10
        },

        {
            id: 1,
            name: 'Grün',
            color: '#4dbb70',
            darkColor: '#267343',
            radius: 26,
            expNeeded: 25
        },

        {
            id: 2,
            name: 'Blau',
            color: '#4c91d8',
            darkColor: '#245b91',
            radius: 38,
            expNeeded: 50
        },

        {
            id: 3,
            name: 'Lila',
            color: '#9664c9',
            darkColor: '#583681',
            radius: 54,
            expNeeded: 100
        },

        {
            id: 4,
            name: 'Gold',
            color: '#d7a52d',
            darkColor: '#8a6413',
            radius: 80,
            expNeeded: Infinity
        }

    ];


    /* =========================================================
       WORLD
    ========================================================= */

    const WORLD_WIDTH = 3200;
    const WORLD_HEIGHT = 2400;

    const SAND_HEIGHT = 80;

    /*
       Vorher 55.
       Jetzt 70 = 15 zusätzliche Fische.
    */

    const MAX_FISHES = 70;


    let width;
    let height;

    let camera = {
        x: 0,
        y: 0
    };


    let isGameRunning = false;
    let isPaused = false;

    let score = 0;

    let targetFPS = 60;


    /* =========================================================
       PLAYER
    ========================================================= */

    let playerName =
        localStorage.getItem(
            'fishup_player_name'
        ) || '';

    document.getElementById(
        'playerNameInput'
    ).value = playerName;


    let player = {

        x: WORLD_WIDTH / 2,
        y: WORLD_HEIGHT / 2,

        rank: 0,

        exp: 0,

        vx: 0,
        vy: 0,

        /*
           20% langsamer:
           5.5 -> 4.4
        */

        speed: 4.4,

        angle: 0,

        targetAngle: 0
    };


    /* =========================================================
       AUDIO
    ========================================================= */

    let audioCtx = null;

    let mainGainNode = null;

    let musicVolume = 0.5;

    let isMusicPlaying = false;

    let musicTimer = null;


    const MELODY_NOTES = [

        { note:"E5", duration:0.18 },
        { note:"B4", duration:0.18 },
        { note:"C5", duration:0.18 },
        { note:"D5", duration:0.18 },

        { note:"C5", duration:0.18 },
        { note:"B4", duration:0.18 },
        { note:"A4", duration:0.18 },
        { note:"A4", duration:0.18 },

        { note:"C5", duration:0.18 },
        { note:"E5", duration:0.18 },
        { note:"D5", duration:0.18 },
        { note:"C5", duration:0.18 },

        { note:"B4", duration:0.28 },
        { note:"C5", duration:0.18 },
        { note:"D5", duration:0.18 },
        { note:"E5", duration:0.28 },

        { note:"C5", duration:0.28 },
        { note:"A4", duration:0.28 },
        { note:"A4", duration:0.4 },

        { note:"D5", duration:0.22 },
        { note:"F5", duration:0.18 },
        { note:"A5", duration:0.18 },
        { note:"G5", duration:0.18 },

        { note:"F5", duration:0.18 },
        { note:"E5", duration:0.28 },
        { note:"C5", duration:0.18 },
        { note:"E5", duration:0.18 },

        { note:"D5", duration:0.18 },
        { note:"C5", duration:0.18 },
        { note:"B4", duration:0.22 },
        { note:"B4", duration:0.18 },

        { note:"C5", duration:0.18 },
        { note:"D5", duration:0.28 },
        { note:"E5", duration:0.28 },
        { note:"C5", duration:0.28 },

        { note:"A4", duration:0.28 },
        { note:"A4", duration:0.4 }

    ];


    function getNoteFrequency(note) {

        const notes = {

            A4:440,
            B4:493.88,
            C5:523.25,
            D5:587.33,
            E5:659.25,
            F5:698.46,
            G5:783.99,
            A5:880

        };

        return notes[note] || 440;
    }


    async function initAudio() {

        try {

            if (!audioCtx) {

                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;

                audioCtx =
                    new AudioContext();

                mainGainNode =
                    audioCtx.createGain();

                mainGainNode.gain.setValueAtTime(
                    musicVolume,
                    audioCtx.currentTime
                );

                mainGainNode.connect(
                    audioCtx.destination
                );
            }

            if (audioCtx.state === 'suspended') {

                await audioCtx.resume();

            }

        } catch(e) {

            console.log(
                "Audio Init Warning:",
                e
            );

        }
    }


    function playTone(freq, duration) {

        if (!audioCtx ||
            musicVolume <= 0) return;

        try {

            const osc =
                audioCtx.createOscillator();

            const noteGain =
                audioCtx.createGain();

            osc.type = 'triangle';

            osc.frequency.setValueAtTime(
                freq,
                audioCtx.currentTime
            );

            noteGain.gain.setValueAtTime(
                0.2,
                audioCtx.currentTime
            );

            noteGain.gain.exponentialRampToValueAtTime(
                0.001,
                audioCtx.currentTime +
                duration -
                0.02
            );

            osc.connect(noteGain);

            noteGain.connect(
                mainGainNode
            );

            osc.start();

            osc.stop(
                audioCtx.currentTime +
                duration
            );

        } catch(e) {}

    }


    async function startMusic() {

        await initAudio();

        if (isMusicPlaying) return;

        isMusicPlaying = true;

        let step = 0;

        function playNextNote() {

            if (!isMusicPlaying) return;

            const noteData =
                MELODY_NOTES[step];

            playTone(
                getNoteFrequency(
                    noteData.note
                ),
                noteData.duration
            );

            step =
                (step + 1) %
                MELODY_NOTES.length;

            musicTimer =
                setTimeout(
                    playNextNote,
                    noteData.duration * 1000
                );
        }

        playNextNote();
    }


    function stopMusic() {

        isMusicPlaying = false;

        if (musicTimer) {

            clearTimeout(
                musicTimer
            );

            musicTimer = null;
        }
    }


    function updateVolume(val) {

        musicVolume =
            val / 100;

        document.getElementById(
            'volumeVal'
        ).innerText =
            val + '%';

        document.getElementById(
            'pauseVolumeVal'
        ).innerText =
            val + '%';

        document.getElementById(
            'pauseVolumeSlider'
        ).value = val;

        if (mainGainNode &&
            audioCtx) {

            mainGainNode.gain.setValueAtTime(
                musicVolume,
                audioCtx.currentTime
            );
        }
    }

    function listenToOnlineLeaderboard() {

        database
            .ref('highscores')
            .orderByChild('score')
            .limitToLast(5)
            .on('value', snapshot => {

                let scores = [];

                snapshot.forEach(child => {

                    scores.push(
                        child.val()
                    );

                });

                scores.reverse();

                renderLeaderboardUI(
                    scores
                );
            });
    }


    function renderLeaderboardUI(list) {

        const listEl =
            document.getElementById(
                'leaderboardList'
            );

        listEl.innerHTML = '';

        if (list.length === 0) {

            listEl.innerHTML =
                '<li class="leaderboard-item">Noch keine Rekorde</li>';

            return;
        }


        list.forEach((item, i) => {

            const li =
                document.createElement(
                    'li'
                );

            li.className =
                `leaderboard-item ${
                    item.name === playerName
                    ? 'highlight'
                    : ''
                }`;

            li.innerHTML =
                `<span>${i + 1}. ${item.name}</span>
                 <span>${item.score}</span>`;

            listEl.appendChild(li);
        });
    }


    function saveScoreOnline(
        name,
        finalScore
    ) {

        if (!name) return;

        const safeName =
            name.replace(
                /[.#$[\]/]/g,
                '_'
            );

        const userRef =
            database.ref(
                'highscores/' +
                safeName
            );

        userRef.once(
            'value',
            snapshot => {

                const data =
                    snapshot.val();

                if (
                    !data ||
                    finalScore >
                    data.score
                ) {

                    userRef.set({

                        name:name,

                        score:finalScore

                    });
                }
            }
        );
    }


    listenToOnlineLeaderboard();

    function updateJoystick() {

        const dx =
            touchCurrentPos.x -
            touchStartPos.x;

        const dy =
            touchCurrentPos.y -
            touchStartPos.y;

        const dist =
            Math.hypot(
                dx,
                dy
            );

        const maxR = 40;

        const angle =
            Math.atan2(
                dy,
                dx
            );

        const moveD =
            Math.min(
                dist,
                maxR
            );

        const kX =
            Math.cos(angle) *
            moveD;

        const kY =
            Math.sin(angle) *
            moveD;

        joystickKnob.style.transform =
            `translate(
                calc(-50% + ${kX}px),
                calc(-50% + ${kY}px)
            )`;


        if (dist > 5) {

            const speedMult =
                Math.min(
                    dist / maxR,
                    1
                );

            player.vx =
                Math.cos(angle) *
                player.speed *
                speedMult;

            player.vy =
                Math.sin(angle) *
                player.speed *
                speedMult;

            player.targetAngle =
                angle;

        } else {

            player.vx = 0;
            player.vy = 0;
        }
    }


    /* =========================================================
       FISH SPAWN
    ========================================================= */

    function spawnFish() {

        const rand =
            Math.random();

        let rank = 0;


        /*
           Gold selten
        */

        if (rand < 0.008)
            rank = 4;

        else if (rand < 0.08)
            rank = 3;

        else if (rand < 0.22)
            rank = 2;

        else if (rand < 0.48)
            rank = 1;


        const margin = 120;


        let x =
            Math.random() < 0.5
            ? camera.x - margin
            : camera.x + width + margin;


        let y =
            Math.random() *
            (
                WORLD_HEIGHT -
                SAND_HEIGHT -
                80
            );


        x =
            Math.max(
                50,
                Math.min(
                    WORLD_WIDTH - 50,
                    x
                )
            );


        y =
            Math.max(
                50,
                y
            );


        const dir =
            Math.random() *
            Math.PI *
            2;


        /*
           NPC ebenfalls 20% langsamer.

           Vorher ca. 3.8
           Jetzt ca. 3.04
        */

        const spd =
            Math.max(
                1.2,
                (3.8 - rank * 0.4) * 0.8
            );


        fishes.push({

            x:x,
            y:y,

            rank:rank,

            radius:
                RANKS[rank].radius,

            speed:spd,

            angle:dir,

            targetAngle:dir,

            turnTimer:
                Math.random() * 100,

            cycle:
                Math.random() * 10,

            finCycle:
                Math.random() * 10
        });
    }


    /* =========================================================
       GAME UPDATE
    ========================================================= */

    function update() {

        if (
            !isGameRunning ||
            isPaused
        ) return;


        player.x +=
            player.vx;

        player.y +=
            player.vy;


        player.x =
            Math.max(
                30,
                Math.min(
                    WORLD_WIDTH - 30,
                    player.x
                )
            );


        player.y =
            Math.max(
                30,
                Math.min(
                    WORLD_HEIGHT -
                    SAND_HEIGHT,
                    player.y
                )
            );


        let diff =
            player.targetAngle -
            player.angle;


        while (
            diff < -Math.PI
        )
            diff +=
                Math.PI * 2;


        while (
            diff > Math.PI
        )
            diff -=
                Math.PI * 2;


        player.angle +=
            diff * 0.15;


        camera.x =
            player.x -
            width / 2;

        camera.y =
            player.y -
            height / 2;


        /* Bubbles */

        bubbles.forEach(b => {

            b.y -= b.speed;

            b.wobble += 0.05;

            b.x +=
                Math.sin(
                    b.wobble
                ) * 0.4;


            if (b.y < 0) {

                b.y =
                    WORLD_HEIGHT;

                b.x =
                    Math.random() *
                    WORLD_WIDTH;
            }
        });


        /* Fische nachfüllen */

        while (
            fishes.length <
            MAX_FISHES
        ) {

            spawnFish();

        }


        const pRad =
            RANKS[player.rank]
                .radius;


        /* NPC */

        for (
            let i = fishes.length - 1;
            i >= 0;
            i--
        ) {

            let f =
                fishes[i];


            f.turnTimer--;


            if (f.turnTimer <= 0) {

                f.turnTimer =
                    100 +
                    Math.random() *
                    200;


                if (
                    Math.random() <
                    0.25
                ) {

                    f.targetAngle =
                        f.angle +
                        (
                            Math.random() -
                            0.5
                        ) *
                        0.8;
                }
            }


            let fDiff =
                f.targetAngle -
                f.angle;


            while (
                fDiff < -Math.PI
            )
                fDiff +=
                    Math.PI * 2;


            while (
                fDiff > Math.PI
            )
                fDiff -=
                    Math.PI * 2;


            f.angle +=
                fDiff * 0.05;


            f.vx =
                Math.cos(
                    f.angle
                ) *
                f.speed;


            f.vy =
                Math.sin(
                    f.angle
                ) *
                f.speed;


            f.x += f.vx;
            f.y += f.vy;


            f.cycle += 0.08;
            f.finCycle += 0.12;


            /* Wände */

            if (
                f.x < 30 ||
                f.x >
                WORLD_WIDTH - 30
            ) {

                f.targetAngle =
                    Math.PI -
                    f.angle;

                f.angle =
                    f.targetAngle;
            }


            if (
                f.y < 30 ||
                f.y >
                WORLD_HEIGHT -
                SAND_HEIGHT
            ) {

                f.targetAngle =
                    -f.angle;

                f.angle =
                    f.targetAngle;
            }


            /* Kollision */

            const dist =
                Math.hypot(
                    player.x - f.x,
                    player.y - f.y
                );


            if (
                dist <
                pRad +
                f.radius * 0.7
            ) {

                if (
                    player.rank >=
                    f.rank
                ) {

                    score +=
                        (f.rank + 1) *
                        10;

                    player.exp += 1;

                    fishes.splice(
                        i,
                        1
                    );


                    if (
                        player.exp >=
                        RANKS[
                            player.rank
                        ].expNeeded &&

                        player.rank <
                        RANKS.length - 1
                    ) {

                        player.exp = 0;

                        player.rank++;

                        updateEatPanel();
                    }


                    updateHUD();

                } else {

                    gameOver();

                    return;
                }
            }
        }
    }

    /* =========================================================
       REALISTISCHER FISCH
    ========================================================= */

    function drawFish(
        x,
        y,
        rankIndex,
        angle,
        cycle
    ) {

        const screenX =
            x - camera.x;

        const screenY =
            y - camera.y;


        const rank =
            RANKS[rankIndex];

        const radius =
            rank.radius;


        if (
            screenX <
                -radius * 2 ||
            screenX >
                width +
                radius * 2 ||
            screenY <
                -radius * 2 ||
            screenY >
                height +
                radius * 2
        ) {

            return;
        }


        ctx.save();

        ctx.translate(
            screenX,
            screenY
        );


        /*
           Der Körper wird normal mit
           der Schwimmrichtung gedreht.

           ABER:
           Das Auge wird später separat
           gezeichnet, damit es immer oben
           bleibt.
        */

        ctx.rotate(angle);


        const wiggle =
            Math.sin(cycle) *
            radius *
            0.12;


        /* =====================
           SCHATTEN
        ===================== */

        ctx.beginPath();

        ctx.ellipse(
            0,
            radius * 0.12,
            radius * 1.02,
            radius * 0.55,
            0,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            'rgba(0,0,0,0.10)';

        ctx.fill();


        /* =====================
           SCHWANZ
        ===================== */

        ctx.beginPath();

        ctx.moveTo(
            -radius * 0.55,
            0
        );

        ctx.quadraticCurveTo(
            -radius * 1.05,
            -radius * 0.55 + wiggle,
            -radius * 1.42,
            -radius * 0.70
        );

        ctx.quadraticCurveTo(
            -radius * 1.12,
            0,
            -radius * 1.42,
            radius * 0.70
        );

        ctx.quadraticCurveTo(
            -radius * 1.05,
            radius * 0.55 + wiggle,
            -radius * 0.55,
            0
        );

        ctx.fillStyle =
            rank.darkColor;

        ctx.fill();


        /* =====================
           RÜCKENFLOSSE
        ===================== */

        ctx.beginPath();

        ctx.moveTo(
            -radius * 0.15,
            -radius * 0.42
        );

        ctx.quadraticCurveTo(
            0,
            -radius * 0.95,
            radius * 0.35,
            -radius * 0.48
        );

        ctx.closePath();

        ctx.fillStyle =
            rank.darkColor;

        ctx.fill();


        /* =====================
           BAUCHFLOSSE
        ===================== */

        ctx.beginPath();

        ctx.moveTo(
            -radius * 0.05,
            radius * 0.38
        );

        ctx.quadraticCurveTo(
            radius * 0.15,
            radius * 0.85,
            radius * 0.45,
            radius * 0.43
        );

        ctx.closePath();

        ctx.fillStyle =
            rank.darkColor;

        ctx.fill();


        /* =====================
           KÖRPER
        ===================== */

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            radius,
            radius * 0.58,
            0,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            rank.color;

        ctx.fill();


        /* =====================
           LICHT AUF KÖRPER
        ===================== */

        ctx.beginPath();

        ctx.ellipse(
            radius * 0.05,
            -radius * 0.15,
            radius * 0.78,
            radius * 0.32,
            0,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            'rgba(255,255,255,0.16)';

        ctx.fill();


        /* =====================
           KIEMEN
        ===================== */

        ctx.beginPath();

        ctx.strokeStyle =
            rank.darkColor;

        ctx.lineWidth =
            Math.max(
                1,
                radius * 0.045
            );

        ctx.arc(
            radius * 0.20,
            0,
            radius * 0.34,
            Math.PI * 0.65,
            Math.PI * 1.35
        );

        ctx.stroke();


        /* =====================
           SEITENLINIE
        ===================== */

        ctx.beginPath();

        ctx.strokeStyle =
            'rgba(255,255,255,0.25)';

        ctx.lineWidth = 1;

        ctx.moveTo(
            -radius * 0.45,
            radius * 0.05
        );

        ctx.quadraticCurveTo(
            0,
            radius * 0.15,
            radius * 0.55,
            radius * 0.04
        );

        ctx.stroke();


        /* =====================
           SCHUPPEN
        ===================== */

        if (radius >= 26) {

            ctx.strokeStyle =
                'rgba(0,0,0,0.12)';

            ctx.lineWidth =
                Math.max(
                    0.6,
                    radius * 0.018
                );


            for (
                let sx = -radius * 0.55;
                sx < radius * 0.48;
                sx += radius * 0.22
            ) {

                ctx.beginPath();

                ctx.arc(
                    sx,
                    radius * 0.12,
                    radius * 0.11,
                    Math.PI,
                    Math.PI * 2
                );

                ctx.stroke();
            }
        }


        /*
           Mund
        */

        ctx.beginPath();

        ctx.strokeStyle =
            rank.darkColor;

        ctx.lineWidth =
            Math.max(
                1,
                radius * 0.035
            );

        ctx.arc(
            radius * 0.82,
            radius * 0.05,
            radius * 0.10,
            0,
            Math.PI * 0.9
        );

        ctx.stroke();


        ctx.restore();


        /* =================================================
           AUGE

           WICHTIG:

           Das Auge wird NICHT mit dem Fisch
           gedreht.

           Dadurch bleibt es immer oben.
        ================================================= */


        /*
           Kopfseite feststellen.

           Wenn der Fisch nach rechts schwimmt,
           liegt das Auge rechts oben.

           Wenn er nach links schwimmt,
           liegt es links oben.
        */

        const facingRight =
            Math.cos(angle) >= 0;


        const headX =
            screenX +
            (
                facingRight
                ? radius * 0.43
                : -radius * 0.43
            );


        const eyeY =
            screenY -
            radius * 0.27;


        const eyeRadius =
            Math.max(
                2.5,
                radius * 0.15
            );


        /* Weiß */

        ctx.beginPath();

        ctx.arc(
            headX,
            eyeY,
            eyeRadius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            '#ffffff';

        ctx.fill();


        /* Pupille */

        ctx.beginPath();

        ctx.arc(
            headX +
                (
                    facingRight
                    ? eyeRadius * 0.18
                    : -eyeRadius * 0.18
                ),

            eyeY,

            eyeRadius * 0.52,

            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            '#111';

        ctx.fill();


        /* Lichtpunkt */

        ctx.beginPath();

        ctx.arc(
            headX +
                (
                    facingRight
                    ? eyeRadius * 0.10
                    : -eyeRadius * 0.10
                ),

            eyeY -
                eyeRadius * 0.18,

            eyeRadius * 0.20,

            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            '#ffffff';

        ctx.fill();
    }


    /* =========================================================
       SONNENSTRAHLEN
    ========================================================= */

    function drawSunRays() {

        ctx.save();

        const time =
            performance.now() *
            0.0005;


        ctx.fillStyle =
            'rgba(255,255,255,0.12)';


        for (
            let i = 0;
            i < 4;
            i++
        ) {

            ctx.beginPath();


            let xStart =
                (width / 3) * i +
                Math.sin(
                    time + i
                ) * 20;


            ctx.moveTo(
                xStart,
                0
            );


            ctx.lineTo(
                xStart + 100,
                0
            );


            ctx.lineTo(
                xStart - 200,
                height
            );


            ctx.lineTo(
                xStart - 320,
                height
            );


            ctx.closePath();

            ctx.fill();
        }


        ctx.restore();
    }


    /* =========================================================
       BACKGROUND
    ========================================================= */

    function drawBackground() {

        /*
           Mitte zwischen Weiß und Blau.
           Viel heller als das ursprüngliche Blau.
        */

        ctx.fillStyle =
            '#a9cee6';

        ctx.fillRect(
            0,
            0,
            width,
            height
        );


        drawSunRays();


        /* Wasserblasen */

        ctx.fillStyle =
            'rgba(255,255,255,0.32)';


        bubbles.forEach(b => {

            let bx =
                b.x -
                camera.x;

            let by =
                b.y -
                camera.y;


            if (
                bx >= 0 &&
                bx <= width &&
                by >= 0 &&
                by <= height
            ) {

                ctx.beginPath();

                ctx.arc(
                    bx,
                    by,
                    b.r,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }

        });


        /* Sandboden */

        const sandY =
            WORLD_HEIGHT -
            SAND_HEIGHT -
            camera.y;


        if (sandY < height) {

            /* Pflanzen */

            ctx.fillStyle =
                '#319c75';


            plants.forEach(p => {

                let px =
                    p.x -
                    camera.x;


                if (
                    px >= -30 &&
                    px <= width + 30
                ) {

                    for (
                        let i = 0;
                        i < p.blades;
                        i++
                    ) {

                        ctx.fillRect(

                            px +
                            (i * 8),

                            sandY -
                            p.height,

                            4,

                            p.height
                        );
                    }
                }
            });


            /* Sand */

            ctx.fillStyle =
                '#e5c158';


            ctx.fillRect(
                0,
                sandY,
                width,
                height - sandY
            );
        }
    }


    /* =========================================================
       DRAW
    ========================================================= */

    function draw() {

        drawBackground();


        fishes.forEach(f => {

            drawFish(
                f.x,
                f.y,
                f.rank,
                f.angle,
                f.cycle
            );

        });


        if (isGameRunning) {

            drawFish(
                player.x,
                player.y,
                player.rank,
                player.angle,
                performance.now() *
                0.01
            );
        }
    }


    /* =========================================================
       GAME OVER
    ========================================================= */

    function gameOver() {

        isGameRunning = false;

        isPaused = false;

        stopMusic();

        saveScoreOnline(
            playerName,
            score
        );


        document
            .getElementById('lastScoreBox')
            .classList.remove('hidden');


        document
            .getElementById('lastScoreVal')
            .innerText =
            score;


        document
            .getElementById('uiOverlay')
            .classList.add('hidden');


        document
            .getElementById('eatPanel')
            .classList.add('hidden');


        document
            .getElementById('pauseButton')
            .style.display =
            'none';


        document
            .getElementById('pauseModal')
            .classList.add('hidden');


        joystickContainer.style.display =
            'none';


        document
            .getElementById('startMenu')
            .classList.remove('hidden');
    }


    /* =========================================================
       START GAME
    ========================================================= */

    function startGame() {

        const input =
            document
                .getElementById(
                    'playerNameInput'
                )
                .value
                .trim();


        if (!input) {

            alert(
                "Bitte gib deinen Namen ein!"
            );

            return;
        }


        playerName =
            input;


        localStorage.setItem(
            'fishup_player_name',
            playerName
        );


        /*
           SEHR WICHTIG:

           isGameRunning wird VOR hideModals
           gesetzt.

           Dadurch kann hideModals()
           das Hauptmenü nicht wieder öffnen.
        */

        isGameRunning = true;

        isPaused = false;


        /*
           Alle Menüs wirklich entfernen.
        */

        document
            .querySelectorAll('.modal-overlay')
            .forEach(m =>
                m.classList.add('hidden')
            );


        document
            .getElementById('uiOverlay')
            .classList.remove('hidden');


        document
            .getElementById('eatPanel')
            .classList.remove('hidden');


        document
            .getElementById('pauseButton')
            .style.display =
            'flex';


        score = 0;


        player.x =
            WORLD_WIDTH / 2;

        player.y =
            WORLD_HEIGHT / 2;


        player.rank = 0;

        player.exp = 0;

        player.vx = 0;

        player.vy = 0;

        player.angle = 0;

        player.targetAngle = 0;


        fishes = [];


        updateHUD();

        updateEatPanel();


        /*
           Direkt viele Fische erzeugen,
           damit beim Start sofort welche
           vorhanden sind.
        */

        while (
            fishes.length <
            MAX_FISHES
        ) {

            spawnFish();

        }


        startMusic();
    }


    /* =========================================================
       GAME LOOP
    ========================================================= */

    let lastTime =
        performance.now();


    function loop(now) {

        const dt =
            now -
            lastTime;


        if (
            dt >=
            1000 / targetFPS
        ) {

            update();

            draw();


            lastTime =
                now -
                (
                    dt %
                    (
                        1000 /
                        targetFPS
                    )
                );
        }


        requestAnimationFrame(
            loop
        );
    }


    requestAnimationFrame(
        loop
    );

</script>

</body>
