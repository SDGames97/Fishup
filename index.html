<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bee Rush 3D</title>

  <!-- iOS / Safari Web-App (PWA) Meta-Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bee Rush">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1a1a1a;
      touch-action: none;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #ui-overlay {
      position: absolute;
      top: env(safe-area-inset-top, 20px);
      left: 20px;
      right: 20px;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      font-size: 18px;
      font-weight: bold;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #powerup-status {
      font-size: 16px;
      color: #ffeb3b;
      margin-top: 4px;
    }

    /* On-Screen Touch-Steuerung */
    #touch-controls {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 30px);
      left: 0;
      width: 100%;
      height: 160px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      pointer-events: none;
    }

    .touch-btn-group {
      display: flex;
      gap: 15px;
      pointer-events: auto;
    }

    .t-btn {
      width: 65px;
      height: 65px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(5px);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      color: white;
      font-size: 26px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    #game-over-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 30;
      padding: 20px;
      text-align: center;
    }

    #game-over-screen h1 {
      font-size: 42px;
      color: #ffcc00;
      margin-bottom: 10px;
    }

    #game-over-screen p {
      font-size: 20px;
      margin: 8px 0;
    }

    #restart-btn {
      margin-top: 25px;
      padding: 16px 40px;
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(135deg, #ff9900, #ff5500);
      color: white;
      border: none;
      border-radius: 30px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }

    .hidden {
      display: none !important;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  
  <div id="ui-overlay">
    <div>Punkte: <span id="score">0</span>m</div>
    <div>🪙 Pollen: <span id="pollen">0</span></div>
    <div>🍯 Honig: <span id="honey">0</span></div>
    <div id="powerup-status"></div>
  </div>

  <!-- Touch Buttons am unteren Bildschirmrand -->
  <div id="touch-controls">
    <div class="touch-btn-group">
      <div class="t-btn" id="btn-left">⬅️</div>
      <div class="t-btn" id="btn-right">➡️</div>
    </div>
    <div class="touch-btn-group">
      <div class="t-btn" id="btn-up">⬆️</div>
      <div class="t-btn" id="btn-down">⬇️</div>
    </div>
  </div>

  <div id="game-over-screen" class="hidden">
    <h1>Game Over!</h1>
    <p>Strecke: <span id="final-score">0</span>m</p>
    <p>Gesammelte Pollen: <span id="final-pollen">0</span></p>
    <button id="restart-btn" onclick="resetGame()">Nochmal fliegen</button>
  </div>

  <script>
    // --- EINSTELLUNGEN & VARIABLEN ---
    const LANES = [-3.2, 0, 3.2];
    let currentLane = 1;
    
    let score = 0;
    let pollenCount = 0;
    let honeyCount = 0;
    let baseSpeed = 0.55;
    let speed = baseSpeed;
    let isGameOver = false;
    
    // Höhen-Mechanik
    let beeY = 1.2;
    let baseBeeY = 1.2;
    let verticalVelocity = 0;
    let isJumping = false;
    let isDucking = false;
    let duckTimer = 0;

    // Power-Up Zustände
    let activePowerup = null;
    let powerupTimer = 0;

    // Szenen-Aufbau
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7ec8e3);
    scene.fog = new THREE.Fog(0x7ec8e3, 30, 110);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Licht
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfff5cc, 1.0);
    dirLight.position.set(15, 30, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- ENDLOSER BODEN & ZÄUNE ---
    const floorSegments = [];
    const segmentLength = 200;

    function createFloorSegment(zPos) {
      const group = new THREE.Group();

      // Grüne Wiese / Weg
      const floorGeo = new THREE.PlaneGeometry(12, segmentLength);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x55a846, roughness: 0.8 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      group.add(floor);

      // Zäune links/rechts
      for (let z = segmentLength / 2; z > -segmentLength / 2; z -= 15) {
        const fenceGeo = new THREE.BoxGeometry(0.4, 1.4, 12);
        const fenceMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
        
        const leftFence = new THREE.Mesh(fenceGeo, fenceMat);
        leftFence.position.set(-6.5, 0.7, z);
        group.add(leftFence);

        const rightFence = leftFence.clone();
        rightFence.position.x = 6.5;
        group.add(rightFence);
      }

      group.position.z = zPos;
      scene.add(group);
      floorSegments.push(group);
    }

    createFloorSegment(0);
    createFloorSegment(-segmentLength);

    // --- BIENE (PLAYER) ---
    const beeGroup = new THREE.Group();

    const bodyGeo = new THREE.SphereGeometry(0.7, 16, 16);
    bodyGeo.scale(1, 1, 1.3);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffcc00 });
    const beeBody = new THREE.Mesh(bodyGeo, bodyMat);
    beeBody.castShadow = true;
    beeGroup.add(beeBody);

    const stripeGeo = new THREE.CylinderGeometry(0.71, 0.71, 0.25, 16);
    const stripeMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const s1 = new THREE.Mesh(stripeGeo, stripeMat);
    s1.rotation.x = Math.PI / 2;
    s1.position.z = -0.15;
    beeGroup.add(s1);

    const s2 = s1.clone();
    s2.position.z = 0.25;
    beeGroup.add(s2);

    const shieldGeo = new THREE.SphereGeometry(1.3, 16, 16);
    const shieldMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4, wireframe: true });
    const shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
    shieldMesh.visible = false;
    beeGroup.add(shieldMesh);

    const wingGeo = new THREE.SphereGeometry(0.45, 8, 8);
    wingGeo.scale(1, 0.05, 0.5);
    const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
    
    const leftWing = new THREE.Mesh(wingGeo, wingMat);
    leftWing.position.set(-0.6, 0.5, 0);
    leftWing.rotation.z = 0.3;
    beeGroup.add(leftWing);

    const rightWing = leftWing.clone();
    rightWing.position.x = 0.6;
    rightWing.rotation.z = -0.3;
    beeGroup.add(rightWing);

    beeGroup.position.set(LANES[currentLane], beeY, 0);
    scene.add(beeGroup);

    // --- OBJEKTE & SPINNER-LOGIK ---
    const obstacles = [];
    const collectables = [];
    const powerups = [];
    let nextSpawnZ = -40;

    // DEUTLICHES HINDERNIS 1: Baumstamm am Boden (DRÜBER SPRINGEN)
    function createLowObstacle(x, z) {
      const group = new THREE.Group();
      
      const logGeo = new THREE.CylinderGeometry(0.5, 0.5, 2.8, 12);
      const logMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });
      const log = new THREE.Mesh(logGeo, logMat);
      log.rotation.z = Math.PI / 2;
      log.position.y = 0.5;
      log.castShadow = true;
      group.add(log);

      // Rotes Schild "DRÜBER"
      const signGeo = new THREE.BoxGeometry(1.2, 0.4, 0.1);
      const signMat = new THREE.MeshBasicMaterial({ color: 0xff2222 });
      const sign = new THREE.Mesh(signGeo, signMat);
      sign.position.set(0, 1.2, 0);
      group.add(sign);

      group.position.set(x, 0, z);
      scene.add(group);
      obstacles.push({ mesh: group, type: 'low', box: new THREE.Box3() });
    }

    // DEUTLICHES HINDERNIS 2: Spinnennetz oben (DRUNTER DUCKEN)
    function createHighObstacle(x, z) {
      const group = new THREE.Group();

      // Pfosten links & rechts
      const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, 3.5, 8);
      const poleMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
      const p1 = new THREE.Mesh(poleGeo, poleMat);
      p1.position.set(-1.2, 1.75, 0);
      const p2 = p1.clone();
      p2.position.x = 1.2;
      group.add(p1);
      group.add(p2);

      // Netz in der Luft
      const webGeo = new THREE.BoxGeometry(2.4, 1.5, 0.1);
      const webMat = new THREE.MeshStandardMaterial({ color: 0xaa00ff, transparent: true, opacity: 0.7 });
      const web = new THREE.Mesh(webGeo, webMat);
      web.position.set(0, 2.2, 0);
      group.add(web);

      group.position.set(x, 0, z);
      scene.add(group);
      obstacles.push({ mesh: group, type: 'high', box: new THREE.Box3() });
    }

    // Rampen
    function createRampObstacle(x, z) {
      const group = new THREE.Group();
      const woodGeo = new THREE.BoxGeometry(2.6, 1.2, 5);
      const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
      const wood = new THREE.Mesh(woodGeo, woodMat);
      wood.position.y = 0.6;
      wood.rotation.x = -0.2;
      group.add(wood);

      group.position.set(x, 0, z);
      scene.add(group);
      obstacles.push({ mesh: group, type: 'ramp', box: new THREE.Box3() });
    }

    function createPollen(x, y, z) {
      const geo = new THREE.SphereGeometry(0.3, 12, 12);
      const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2 });
      const pollen = new THREE.Mesh(geo, mat);
      pollen.position.set(x, y, z);
      scene.add(pollen);
      collectables.push({ mesh: pollen, type: 'pollen', box: new THREE.Box3() });
    }

    function createHoneyDrop(x, z) {
      const dropGeo = new THREE.SphereGeometry(0.35, 12, 12);
      dropGeo.scale(1, 1.4, 1);
      const dropMat = new THREE.MeshStandardMaterial({ color: 0xff8c00, roughness: 0.1 });
      const drop = new THREE.Mesh(dropGeo, dropMat);
      drop.position.set(x, 1.3, z);
      scene.add(drop);
      collectables.push({ mesh: drop, type: 'honey', box: new THREE.Box3() });
    }

    function createPowerUp(x, z) {
      const types = ['magnet', 'shield', 'turbo'];
      const chosenType = types[Math.floor(Math.random() * types.length)];
      
      let color = 0x0000ff;
      if (chosenType === 'shield') color = 0x00ff00;
      if (chosenType === 'turbo') color = 0xffff00;

      const geo = new THREE.OctahedronGeometry(0.45);
      const mat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.6 });
      const pUp = new THREE.Mesh(geo, mat);
      pUp.position.set(x, 1.4, z);
      scene.add(pUp);
      powerups.push({ mesh: pUp, pType: chosenType, box: new THREE.Box3() });
    }

    // Endloses Spawnen vor dem Spieler
    function spawnNextSection() {
      while (nextSpawnZ > beeGroup.position.z - 180) {
        const lane = LANES[Math.floor(Math.random() * 3)];
        const rand = Math.random();

        if (rand < 0.3) {
          createLowObstacle(lane, nextSpawnZ);
        } else if (rand < 0.55) {
          createHighObstacle(lane, nextSpawnZ);
        } else if (rand < 0.7) {
          createRampObstacle(lane, nextSpawnZ);
        } else if (rand < 0.9) {
          if (Math.random() > 0.4) createPollen(lane, 1.2, nextSpawnZ);
          else createHoneyDrop(lane, nextSpawnZ);
        } else {
          createPowerUp(lane, nextSpawnZ);
        }
        nextSpawnZ -= 18;
      }
    }

    // --- STEUERUNGS-AKTIONEN ---
    function moveLeft() { if (!isGameOver && currentLane > 0) currentLane--; }
    function moveRight() { if (!isGameOver && currentLane < LANES.length - 1) currentLane++; }
    function jump() {
      if (!isGameOver && !isJumping && !isDucking) {
        isJumping = true;
        verticalVelocity = 0.24;
      }
    }
    function duck() {
      if (!isGameOver && !isJumping && !isDucking) {
        isDucking = true;
        duckTimer = 35;
      }
    }

    // Touch Buttons
    document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft(); });
    document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); moveRight(); });
    document.getElementById('btn-up').addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
    document.getElementById('btn-down').addEventListener('touchstart', (e) => { e.preventDefault(); duck(); });

    // Touch Swipes
    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (isGameOver) return;
      const diffX = e.changedTouches[0].clientX - touchStartX;
      const diffY = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (Math.abs(diffX) > 30) {
          if (diffX > 0) moveRight(); else moveLeft();
        }
      } else {
        if (Math.abs(diffY) > 30) {
          if (diffY < 0) jump(); else duck();
        }
      }
    }, { passive: false });

    // --- POWER-UPS ---
    function activatePowerup(type) {
      activePowerup = type;
      powerupTimer = 300;
      if (type === 'shield') shieldMesh.visible = true;
      if (type === 'turbo') speed = baseSpeed * 1.8;
    }

    function updatePowerups() {
      const statusDiv = document.getElementById('powerup-status');
      if (powerupTimer > 0) {
        powerupTimer--;
        statusDiv.innerText = `🚀 Power-Up: ${activePowerup.toUpperCase()} (${Math.ceil(powerupTimer / 60)}s)`;
      } else {
        if (activePowerup === 'turbo') speed = baseSpeed;
        if (activePowerup === 'shield') shieldMesh.visible = false;
        activePowerup = null;
        statusDiv.innerText = '';
      }
    }

    // --- GAME LOOP ---
    let wingFlap = 0;

    function animate() {
      if (isGameOver) return;

      requestAnimationFrame(animate);

      // Biene fliegt stetig nach vorne (-Z)
      baseSpeed += 0.00002;
      if (activePowerup !== 'turbo') speed = baseSpeed;
      beeGroup.position.z -= speed;

      // Flügel-Animation
      wingFlap += 0.35;
      leftWing.rotation.z = 0.3 + Math.sin(wingFlap) * 0.35;
      rightWing.rotation.z = -0.3 - Math.sin(wingFlap) * 0.35;

      // Spurwechsel-Animation
      beeGroup.position.x += (LANES[currentLane] - beeGroup.position.x) * 0.2;

      // Springen / Ducken
      if (isJumping) {
        beeY += verticalVelocity;
        verticalVelocity -= 0.012;
        if (beeY <= baseBeeY) {
          beeY = baseBeeY;
          isJumping = false;
        }
      } else if (isDucking) {
        beeY = 0.3;
        duckTimer--;
        if (duckTimer <= 0) {
          beeY = baseBeeY;
          isDucking = false;
        }
      }
      beeGroup.position.y = beeY;

      // Kamera folgt der Biene von hinten (Subway Surfers Style)
      camera.position.x = beeGroup.position.x * 0.3;
      camera.position.y = beeGroup.position.y + 3.8;
      camera.position.z = beeGroup.position.z + 6.5;
      camera.lookAt(beeGroup.position.x * 0.5, beeGroup.position.y + 0.8, beeGroup.position.z - 10);

      // Endlose Boden-Segmente verschieben
      floorSegments.forEach(seg => {
        if (seg.position.z - segmentLength / 2 > beeGroup.position.z) {
          seg.position.z -= segmentLength * 2;
        }
      });

      // Neue Hindernisse spawnen
      spawnNextSection();
      updatePowerups();

      // Punkte = Geflogene Distanz
      score = Math.floor(Math.abs(beeGroup.position.z));
      document.getElementById('score').innerText = score;

      const playerBox = new THREE.Box3().setFromObject(beeGroup);

      // Hindernis-Kollision
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.box.setFromObject(obs.mesh);

        if (playerBox.intersectsBox(obs.box)) {
          if (activePowerup === 'turbo') {
            scene.remove(obs.mesh);
            obstacles.splice(i, 1);
            continue;
          }

          if (activePowerup === 'shield') {
            activePowerup = null;
            shieldMesh.visible = false;
            powerupTimer = 0;
            scene.remove(obs.mesh);
            obstacles.splice(i, 1);
            continue;
          }

          if (obs.type === 'low' && beeGroup.position.y > 1.0) {
            // Drübergesprungen -> Sicher!
          } else if (obs.type === 'high' && beeGroup.position.y < 0.6) {
            // Druntergeduckt -> Sicher!
          } else if (obs.type === 'ramp') {
            beeGroup.position.y = 2.0;
            isJumping = false;
          } else {
            endGame();
          }
        }

        // Entfernen, wenn hinter dem Spieler
        if (obs.mesh.position.z > beeGroup.position.z + 10) {
          scene.remove(obs.mesh);
          obstacles.splice(i, 1);
        }
      }

      // Sammelobjekte
      for (let i = collectables.length - 1; i >= 0; i--) {
        const item = collectables[i];
        item.mesh.rotation.y += 0.04;

        if (activePowerup === 'magnet' && item.type === 'pollen') {
          item.mesh.position.x += (beeGroup.position.x - item.mesh.position.x) * 0.25;
          item.mesh.position.y += (beeGroup.position.y - item.mesh.position.y) * 0.25;
          item.mesh.position.z += (beeGroup.position.z - item.mesh.position.z) * 0.25;
        }

        item.box.setFromObject(item.mesh);

        if (playerBox.intersectsBox(item.box)) {
          if (item.type === 'pollen') {
            pollenCount++;
            document.getElementById('pollen').innerText = pollenCount;
          } else {
            honeyCount++;
            document.getElementById('honey').innerText = honeyCount;
          }
          scene.remove(item.mesh);
          collectables.splice(i, 1);
        } else if (item.mesh.position.z > beeGroup.position.z + 10) {
          scene.remove(item.mesh);
          collectables.splice(i, 1);
        }
      }

      // Power-Ups
      for (let i = powerups.length - 1; i >= 0; i--) {
        const pUp = powerups[i];
        pUp.mesh.rotation.y += 0.06;
        pUp.box.setFromObject(pUp.mesh);

        if (playerBox.intersectsBox(pUp.box)) {
          activatePowerup(pUp.pType);
          scene.remove(pUp.mesh);
          powerups.splice(i, 1);
        } else if (pUp.mesh.position.z > beeGroup.position.z + 10) {
          scene.remove(pUp.mesh);
          powerups.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    function endGame() {
      isGameOver = true;
      document.getElementById('final-score').innerText = score;
      document.getElementById('final-pollen').innerText = pollenCount;
      document.getElementById('game-over-screen').classList.remove('hidden');
    }

    function resetGame() {
      obstacles.forEach(o => scene.remove(o.mesh));
      collectables.forEach(c => scene.remove(c.mesh));
      powerups.forEach(p => scene.remove(p.mesh));
      
      obstacles.length = 0;
      collectables.length = 0;
      powerups.length = 0;

      score = 0;
      pollenCount = 0;
      honeyCount = 0;
      baseSpeed = 0.55;
      speed = baseSpeed;
      currentLane = 1;
      nextSpawnZ = -40;
      activePowerup = null;
      powerupTimer = 0;
      shieldMesh.visible = false;

      beeGroup.position.set(LANES[currentLane], baseBeeY, 0);

      document.getElementById('score').innerText = 0;
      document.getElementById('pollen').innerText = 0;
      document.getElementById('honey').innerText = 0;
      document.getElementById('game-over-screen').classList.add('hidden');

      isGameOver = false;
      animate();
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
