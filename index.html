<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1d3a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #1e3d59;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            background: linear-gradient(to bottom, #174d75, #081a2e);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const width = canvas.width;
const height = canvas.height;

// Ränge/Stufen der Fische
const RANKS = [
    { radius: 15, color: '#ff6b6b', darkColor: '#c0392b' },
    { radius: 25, color: '#4ecdc4', darkColor: '#16a085' },
    { radius: 38, color: '#ffeaa7', darkColor: '#d35400' },
    { radius: 55, color: '#a29bfe', darkColor: '#6c5ce7' }
];

// Kamera & Zustand
const camera = { x: 0, y: 0 };
let swimCycle = 0;

// Test-Fisch Objekt
const fish = {
    x: 400,
    y: 300,
    rankIndex: 1,
    angle: 0,
    targetX: 400,
    targetY: 300
};

// Maussteuerung für die Bewegung
canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    fish.targetX = e.clientX - rect.left;
    fish.targetY = e.clientY - rect.top;
});

// --- DIE ÜBERARBEITETE DRAW-FUNKTION (MIT 3D-FLIP FÜR DAS AUGE) ---
function drawFish(x, y, rankIndex, angle, cycle) {
    let screenX = x - camera.x;
    let screenY = y - camera.y;
    const rank = RANKS[rankIndex];
    const radius = rank.radius;

    if (screenX < -radius * 2 || screenX > width + radius * 2 ||
        screenY < -radius * 2 || screenY > height + radius * 2) {
        return;
    }

    ctx.save();
    ctx.translate(screenX, screenY);

    // BERECHNUNG DER RICHTUNG (Links vs. Rechts)
    let normAngle = angle;
    while (normAngle < -Math.PI) normAngle += Math.PI * 2;
    while (normAngle > Math.PI) normAngle -= Math.PI * 2;
    
    const isFacingLeft = Math.abs(normAngle) > Math.PI / 2;

    // 3D-SP IEGELUNG: Dreht das gesamte Modell sauber um, wenn der Fisch nach links schwimmt
    if (isFacingLeft) {
        ctx.scale(1, -1);
        ctx.rotate(-angle);
    } else {
        ctx.rotate(angle);
    }

    const tailWiggle = Math.sin(cycle) * 0.2;

    // Schwanzflosse
    ctx.beginPath();
    ctx.fillStyle = rank.darkColor;
    ctx.moveTo(-radius * 0.7, 0);
    ctx.quadraticCurveTo(-radius * 1.3, -radius * 0.6 + tailWiggle * 8, -radius * 1.4, -radius * 0.6 + tailWiggle * 8);
    ctx.quadraticCurveTo(-radius * 1.1, 0, -radius * 1.4, radius * 0.6 + tailWiggle * 8);
    ctx.quadraticCurveTo(-radius * 1.3, radius * 0.6 + tailWiggle * 8, -radius * 0.7, 0);
    ctx.fill();

    // Fischkörper
    ctx.beginPath();
    ctx.fillStyle = rank.color;
    ctx.ellipse(0, 0, radius, radius * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();

    // Kiemen
    if (rankIndex >= 1) {
        ctx.beginPath();
        ctx.strokeStyle = rank.darkColor;
        ctx.lineWidth = 1.5;
        ctx.arc(radius * 0.1, 0, radius * 0.35, Math.PI * 0.7, Math.PI * 1.3);
        ctx.stroke();
    }

    // SAUBERES COMIC-AUGE (Fest verankert, wird beim Wenden automatisch mitgespiegelt)
    const eyeX = radius * 0.45;
    const eyeY = -radius * 0.2;
    const eyeRadius = Math.max(2.5, radius * 0.15);

    // Weißer Augapfel
    ctx.beginPath();
    ctx.arc(eyeX, eyeY, eyeRadius, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    // Schwarze Pupille
    ctx.beginPath();
    ctx.arc(eyeX + eyeRadius * 0.25, eyeY, eyeRadius * 0.5, 0, Math.PI * 2);
    ctx.fillStyle = '#000000';
    ctx.fill();

    // Licht-Glanzpunkt
    ctx.beginPath();
    ctx.arc(eyeX + eyeRadius * 0.1, eyeY - eyeRadius * 0.2, eyeRadius * 0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    ctx.restore();
}

// Game Loop
function gameLoop() {
    ctx.clearRect(0, 0, width, height);

    // Bewegung berechnen
    const dx = fish.targetX - fish.x;
    const dy = fish.targetY - fish.y;
    
    if (Math.hypot(dx, dy) > 5) {
        fish.angle = Math.atan2(dy, dx);
        fish.x += dx * 0.05;
        fish.y += dy * 0.05;
        swimCycle += 0.15;
    }

    // Fisch zeichnen
    drawFish(fish.x, fish.y, fish.rankIndex, fish.angle, swimCycle);

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
